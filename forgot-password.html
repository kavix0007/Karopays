<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password — KaroPays</title><link rel="stylesheet" href="assets/css/pro.css"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png"><meta name="theme-color" content="#5271ff"></head>
<body><main class="auth-wrap"><a class="logo" href="index.html" aria-label="KaroPays home"><img class="logo-img" src="assets/img/karopays-logo.png" alt="KaroPays" width="112" height="52"></a><form class="auth-card" id="forgotForm"><div class="section-label">ACCOUNT RECOVERY</div><h1>Reset your password.</h1><p class="lead">Enter the email address linked to your KaroPays account. We'll send a secure reset link if the account can receive recovery email.</p><label for="email">Email<input id="email" name="email" type="email" autocomplete="email" required></label><p id="message" class="form-message" role="status" aria-live="polite"></p><button class="primary full" id="sendButton" type="submit">Send reset link</button><p><a href="login.html">Back to sign in</a></p></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script>
const form=document.getElementById('forgotForm'),msg=document.getElementById('message'),btn=document.getElementById('sendButton');
form.addEventListener('submit',async e=>{e.preventDefault();const email=document.getElementById('email').value.trim();if(!email)return;btn.disabled=true;btn.textContent='Sending…';msg.textContent='';try{const{error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:new URL('reset-password.html',location.href).href});if(error)throw error;msg.textContent='If this email is registered, a password-reset link will be sent. Check your inbox and spam folder.';}catch(err){msg.textContent=err?.message||'Could not send the reset email. Please try again.';}finally{btn.disabled=false;btn.textContent='Send reset link';}});
</script></body></html>
