<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password — KaroPays</title><link rel="stylesheet" href="assets/css/pro.css"><link rel="icon" href="/favicon.ico" sizes="any"></head><body><main class="auth-wrap"><a class="logo" href="index.html"><img class="logo-img" src="assets/img/karopays-logo.png" alt="KaroPays" width="112" height="52"></a><form class="auth-card" id="forgotForm"><div class="section-label">ACCOUNT RECOVERY</div><h1>Reset your password</h1><p>Enter your account email and we'll send a recovery link if the account exists.</p><label for="email">Email<input id="email" type="email" required autocomplete="email"></label><p id="message" class="form-message" role="status" aria-live="polite"></p><button class="primary full" id="sendBtn" type="submit">Send reset link</button><p><a href="login.html">Back to sign in</a></p></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script>const form=document.getElementById('forgotForm'),msg=document.getElementById('message'),btn=document.getElementById('sendBtn');form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Sending...';msg.textContent='';try{const{error}=await supabaseClient.auth.resetPasswordForEmail(document.getElementById('email').value.trim(),{redirectTo:location.origin+'/reset-password.html'});if(error)throw error;msg.textContent='If this email is registered, a password reset link has been sent.';}catch(err){msg.textContent=err.message||'Could not send the reset email. Try again.';}finally{btn.disabled=false;btn.textContent='Send reset link';}});</script></body></html>
