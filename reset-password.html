<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose New Password — KaroPays</title><link rel="stylesheet" href="assets/css/pro.css"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png"><meta name="theme-color" content="#5271ff"></head>
<body><main class="auth-wrap"><a class="logo" href="index.html" aria-label="KaroPays home"><img class="logo-img" src="assets/img/karopays-logo.png" alt="KaroPays" width="112" height="52"></a><form class="auth-card" id="resetForm"><div class="section-label">ACCOUNT RECOVERY</div><h1>Choose a new password.</h1><label for="password">New password<input id="password" type="password" autocomplete="new-password" minlength="8" required></label><label for="confirmPassword">Confirm new password<input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></label><p id="message" class="form-message" role="status" aria-live="polite"></p><button class="primary full" id="saveButton" type="submit">Save new password</button><p><a href="login.html">Back to sign in</a></p></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script>
const form=document.getElementById('resetForm'),msg=document.getElementById('message'),btn=document.getElementById('saveButton');
(async()=>{try{const hash=new URLSearchParams(location.hash.slice(1));const access=hash.get('access_token'),refresh=hash.get('refresh_token');if(access&&refresh){const{error}=await supabaseClient.auth.setSession({access_token:access,refresh_token:refresh});if(error)throw error;}else{const{data,error}=await supabaseClient.auth.getSession();if(error||!data.session){msg.textContent='This reset link may have expired. Request a new one.';btn.disabled=true;}}}catch(e){msg.textContent=e?.message||'This reset link is invalid or expired.';btn.disabled=true;}})();
form.addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('password').value,c=document.getElementById('confirmPassword').value;if(p.length<8){msg.textContent='Use at least 8 characters.';return}if(p!==c){msg.textContent='Passwords do not match.';return}btn.disabled=true;btn.textContent='Saving…';try{const{error}=await supabaseClient.auth.updateUser({password:p});if(error)throw error;msg.textContent='Password updated. You can now sign in with your new password.';form.reset();}catch(err){msg.textContent=err?.message||'Could not update password. Request a new reset link if needed.';}finally{btn.disabled=false;btn.textContent='Save new password';}});
</script></body></html>
