<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose New Password — KaroPays</title><link rel="stylesheet" href="assets/css/pro.css"><link rel="icon" href="/favicon.ico" sizes="any"></head><body><main class="auth-wrap"><a class="logo" href="index.html"><img class="logo-img" src="assets/img/karopays-logo.png" alt="KaroPays" width="112" height="52"></a><form class="auth-card" id="resetForm"><div class="section-label">ACCOUNT RECOVERY</div><h1>Choose a new password</h1><label for="password">New password<input id="password" type="password" required minlength="8" autocomplete="new-password"></label><label for="confirm">Confirm password<input id="confirm" type="password" required minlength="8" autocomplete="new-password"></label><p id="message" class="form-message" role="status" aria-live="polite"></p><button class="primary full" id="saveBtn" type="submit">Update password</button></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script>const form=document.getElementById('resetForm'),msg=document.getElementById('message'),btn=document.getElementById('saveBtn');supabaseClient.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY')msg.textContent='Recovery link verified. Choose your new password.'});form.addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('password').value,c=document.getElementById('confirm').value;if(p.length<8){msg.textContent='Use at least 8 characters.';return}if(p!==c){msg.textContent='Passwords do not match.';return}btn.disabled=true;btn.textContent='Updating...';try{const{error}=await supabaseClient.auth.updateUser({password:p});if(error)throw error;msg.textContent='Password updated. You can now sign in.';form.reset();setTimeout(()=>location.href='login.html',1400)}catch(err){msg.textContent=err.message||'Could not update password. Reopen the reset link and try again.'}finally{btn.disabled=false;btn.textContent='Update password'}});</script></body></html>
