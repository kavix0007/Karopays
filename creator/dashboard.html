<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Creator Dashboard — KaroPays</title>

  <link
    rel="stylesheet"
    href="../assets/css/pro.css"

  <style>

    /* =========================================
       KAROPAYS DASHBOARD
    ========================================= */

    .dashboard-top {
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:20px;
      margin-bottom:30px;
      flex-wrap:wrap;
    }

    .creator-email {

      word-break:break-all;
    }

    .dashboard-actions {
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .file-item {
      padding:24px 0;

    }

    .file-item:last-child {
      border-bottom:0;
    }

    .file-title {
      margin:0 0 8px;

    }

    .file-description {
      color:#9298a4;
      line-height:1.6;
      margin:8px 0;
      word-break:break-word;
    }

    .file-meta {
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin:12px 0;
    }

    .file-meta span {
      padding:7px 10px;
      background:#151820;
      border:1px solid #292d37;
      border-radius:8px;
      color:#a9aeb8;
      font-size:12px;
    }

    .file-stats {
      display:flex;
      gap:20px;
      flex-wrap:wrap;
      color:#9298a4;
      margin:12px 0;
    }

    .file-stats strong {
      color:#fff;
    }

    .file-buttons {
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:16px;
    }

    .dashboard-btn {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border:0;
      border-radius:9px;
      background:#7c5cff;
      color:#fff;
      padding:10px 15px;
      font-weight:800;
      cursor:pointer;
      font-size:13px;
      text-decoration:none;
    }

    .dashboard-btn:hover {
      opacity:.9;
    }

    .dashboard-btn.secondary {
      background:#151820;
      border:1px solid #292d37;
    }

    .dashboard-btn.danger {
      background:#29141a;
      border:1px solid #5a2732;
      color:#ff9aa8;
    }

    .dashboard-btn:disabled {
      opacity:.5;
      cursor:not-allowed;
    }

    .edit-box {
      margin-top:18px;
      padding:20px;
      background:#0c0e13;
      border:1px solid #292d37;
      border-radius:12px;
      display:none;
    }

    .edit-box.open {
      display:block;
    }

    .edit-box label {
      margin:12px 0;
    }

    .edit-box input,
    .edit-box textarea,
    .edit-box select {
      width:100%;
      background:#0e1015;
      border:1px solid #292d37;
      color:#fff;
      border-radius:9px;
      padding:12px;
      font:inherit;
      margin-top:7px;
    }

    .edit-buttons {
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:14px;
    }

    .status-message {
      min-height:22px;
      color:#a9aeb8;
      margin:12px 0;
    }

    .success-message {
      color:#9fe3b1;
    }

    .error-message {
      color:#ff9aa8;
    }

    .copy-notice {
      position:fixed;
      left:50%;
      bottom:25px;
      transform:translateX(-50%);
      background:#171320;
      border:1px solid #493d70;
      color:#fff;
      padding:12px 18px;
      border-radius:10px;
      box-shadow:0 10px 35px rgba(0,0,0,.35);
      z-index:9999;
      display:none;
    }

    .copy-notice.show {
      display:block;
    }

    @media(max-width:700px) {

      .dashboard-top {
        align-items:flex-start;
      }

        display:grid;
        grid-template-columns:1fr 1fr;
      }

        width:100%;
      }

  </style>

<!-- =========================================
     SUPABASE
========================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../assets/js/supabase-config.js"></script>


<script>

/* =========================================
   ELEMENTS
========================================= */

const creatorEmail =
  document.getElementById("creatorEmail");

const totalEarnings =
  document.getElementById("totalEarnings");

const totalDownloads =
  document.getElementById("totalDownloads");

const availableBalance =
  document.getElementById("availableBalance");

const filesContainer =
  document.getElementById("filesContainer");

const dashboardMessage =
  document.getElementById("dashboardMessage");

const signOut =
  document.getElementById("signOut");

const refreshButton =
  document.getElementById("refreshButton");

const copyNotice =
  document.getElementById("copyNotice");


/* =========================================
   CURRENT USER
========================================= */

let currentUser = null;


/* =========================================
   START
========================================= */

loadDashboard();


/* =========================================
   LOAD DASHBOARD
========================================= */

async function loadDashboard() {

  try {

    dashboardMessage.textContent =
      "";

    /*
     * Check current authenticated user.
     */

    const {
      data: {
        user
      },
      error: sessionError
    } =
      await supabaseClient.auth.getUser();


    if (
      sessionError ||
      !user
    ) {

      window.location.replace(
        "../login.html"
      );

      return;

    }


    currentUser =
      user;


    creatorEmail.textContent =
      user.email ||
      "Creator";


    /*
     * Load creator files.
     */

    const {
      data: files,
      error: filesError
    } =
      await supabaseClient

        .from("files")

        .select(
          "id,file_name,file_size,description,category,ad_level,downloads,earnings,status,storage_path,created_at"
        )

        .eq(
          "creator_id",
          user.id
        )

        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if (filesError) {

      console.error(
        "Files error:",
        filesError
      );

      throw new Error(
        "Could not load your files: " +
        filesError.message
      );

    }


    const creatorFiles =
      files || [];


    /*
     * Calculate totals.
     */

    let downloads = 0;

    let earnings = 0;


    creatorFiles.forEach(
      function(file) {

        downloads +=
          Number(
            file.downloads || 0
          );

        earnings +=
          Number(
            file.earnings || 0
          );

      }
    );


    /*
     * Display totals.
     */

    totalDownloads.textContent =
      downloads.toLocaleString();


    totalEarnings.textContent =
      formatMoney(
        earnings
      );


    /*
     * For now available balance
     * equals total earnings.
     */

    availableBalance.textContent =
      formatMoney(
        earnings
      );


    /*
     * Render files.
     */

    renderFiles(
      creatorFiles
    );


  } catch (error) {

    console.error(
      "Dashboard error:",
      error
    );


    dashboardMessage.textContent =
      error.message ||
      "Unable to load dashboard.";

    dashboardMessage.className =
      "status-message error-message";

  }

}


/* =========================================
   RENDER FILES
========================================= */

function renderFiles(files) {

  if (!files.length) {

    filesContainer.innerHTML =
      `
        <div class="empty">

          <p>
            No files yet.
          </p>

          <a
            class="primary"
            href="../upload.html"
          >
            Upload your first file
          </a>

        </div>
      `;

    return;

  }


  let html = "";


  files.forEach(
    function(file) {

      const fileId =
        encodeURIComponent(
          file.id
        );


      const fileName =
        escapeHtml(
          file.file_name ||
          "Unnamed file"
        );


      const description =
        escapeHtml(
          file.description ||
          "No description provided."
        );


      const category =
        escapeHtml(
          file.category ||
          "Other"
        );


      const status =
        escapeHtml(
          file.status ||
          "unknown"
        );


      const adLevel =
        Number(
          file.ad_level || 1
        );


      const downloads =
        Number(
          file.downloads || 0
        );


      const earnings =
        Number(
          file.earnings || 0
        );


      html +=
        `

        <article
          class="file-item"
          data-file-id="${fileId}"
        >

          <h3 class="file-title">
            ${fileName}
          </h3>


          <p class="file-description">
            ${description}
          </p>


          <div class="file-meta">

            <span>
              ${category}
            </span>

            <span>
              Ad Level ${adLevel}
            </span>

            <span>
              ${status}
            </span>

          </div>


          <div class="file-stats">

            <span>
              <strong>
                ${downloads.toLocaleString()}
              </strong>
              downloads
            </span>


            <span>
              <strong>
                ${formatMoney(earnings)}
              </strong>
              earnings
            </span>

          </div>


          <div class="file-buttons">

            <!-- VIEW -->

            <a
              class="dashboard-btn"
              href="../file.html?id=${fileId}"
            >
              View
            </a>


            <!-- SHARE -->

            <button
              class="dashboard-btn secondary"
              type="button"
              onclick="shareFile('${escapeJs(file.id)}')"
            >
              Share
            </button>


            <!-- EDIT -->

            <button
              class="dashboard-btn secondary"
              type="button"
              onclick="toggleEdit('${escapeJs(file.id)}')"
            >
              Edit
            </button>


            <!-- DELETE -->

            <button
              class="dashboard-btn danger"
              type="button"
              onclick="deleteFile('${escapeJs(file.id)}')"
            >
              Delete
            </button>

          </div>


          <!-- EDIT BOX -->

          <div
            id="edit-${fileId}"
            class="edit-box"
          >

            <label>

              File name

              <input
                id="name-${fileId}"
                type="text"
                value="${escapeAttribute(
                  file.file_name || ""
                )}"
                maxlength="200"
              >

            </label>


            <label>

              Description

              <textarea
                id="description-${fileId}"
                rows="4"
                maxlength="1000"
              >${escapeHtml(
                file.description || ""
              )}</textarea>

            </label>


            <label>

              Category

              <select
                id="category-${fileId}"
              >

                <option
                  value="Presets"
                  ${file.category === "Presets" ? "selected" : ""}
                >
                  Presets
                </option>

                <option
                  value="Templates"
                  ${file.category === "Templates" ? "selected" : ""}
                >
                  Templates
                </option>

                <option
                  value="Wallpapers"
                  ${file.category === "Wallpapers" ? "selected" : ""}
                >
                  Wallpapers
                </option>

                <option
                  value="Resources"
                  ${file.category === "Resources" ? "selected" : ""}
                >
                  Resources
                </option>

                <option
                  value="Other"
                  ${file.category === "Other" || !file.category ? "selected" : ""}
                >
                  Other
                </option>

              </select>

            </label>


            <label>

              Ad level

              <select
                id="adlevel-${fileId}"
              >

                <option
                  value="1"
                  ${adLevel === 1 ? "selected" : ""}
                >
                  1 — Low
                </option>

                <option
                  value="2"
                  ${adLevel === 2 ? "selected" : ""}
                >
                  2 — Medium
                </option>

                <option
                  value="3"
                  ${adLevel === 3 ? "selected" : ""}
                >
                  3 — High
                </option>

                <option
                  value="4"
                  ${adLevel === 4 ? "selected" : ""}
                >
                  4 — Ultra
                </option>

              </select>

            </label>


            <div class="edit-buttons">

              <button
                class="dashboard-btn"
                type="button"
                onclick="saveEdit('${escapeJs(file.id)}')"
              >
                Save changes
              </button>


              <button
                class="dashboard-btn secondary"
                type="button"
                onclick="toggleEdit('${escapeJs(file.id)}')"
              >
                Cancel
              </button>

            </div>


            <p
              id="edit-message-${fileId}"
              class="status-message"
            ></p>

          </div>

        </article>

        `;

    }
  );


  filesContainer.innerHTML =
    html;

}


/* =========================================
   SHARE FILE
========================================= */

async function shareFile(fileId) {

  const shareUrl =
    new URL(
      "../file.html?id=" +
      encodeURIComponent(fileId),
      window.location.href
    ).href;


  try {

    /*
     * Modern browser share.
     */

    if (
      navigator.share
    ) {

      await navigator.share({

        title:
          "Download file — KaroPays",

        url:
          shareUrl

      });

      return;

    }


    /*
     * Clipboard fallback.
     */

    await navigator.clipboard.writeText(
      shareUrl
    );


    showCopyNotice(
      "File link copied!"
    );


  } catch (error) {

    /*
     * User cancelling native
     * share is not an error.
     */

    if (
      error &&
      error.name === "AbortError"
    ) {

      return;

    }


    /*
     * Older browser fallback.
     */

    try {

      const temporary =
        document.createElement(
          "textarea"
        );

      temporary.value =
        shareUrl;

      document.body.appendChild(
        temporary
      );

      temporary.select();

      document.execCommand(
        "copy"
      );

      temporary.remove();


      showCopyNotice(
        "File link copied!"
      );


    } catch (copyError) {

      console.error(
        "Copy error:",
        copyError
      );


      showCopyNotice(
        "Could not copy the link."
      );

    }

  }

}


/* =========================================
   SHOW COPY NOTICE
========================================= */

function showCopyNotice(message) {

  copyNotice.textContent =
    message;

  copyNotice.classList.add(
    "show"
  );


  setTimeout(
    function() {

      copyNotice.classList.remove(
        "show"
      );

    },
    2200
  );

}


/* =========================================
   TOGGLE EDIT
========================================= */

function toggleEdit(fileId) {

  const box =
    document.getElementById(
      "edit-" +
      encodeURIComponent(fileId)
    );


  if (!box) {
    return;
  }


  box.classList.toggle(
    "open"
  );

}


/* =========================================
   SAVE EDIT
========================================= */

async function saveEdit(fileId) {

  if (!currentUser) {

    window.location.replace(
      "../login.html"
    );

    return;

  }


  const encodedId =
    encodeURIComponent(
      fileId
    );


  const nameInput =
    document.getElementById(
      "name-" +
      encodedId
    );


  const descriptionInput =
    document.getElementById(
      "description-" +
      encodedId
    );


  const categoryInput =
    document.getElementById(
      "category-" +
      encodedId
    );


  const adLevelInput =
    document.getElementById(
      "adlevel-" +
      encodedId
    );


  const message =
    document.getElementById(
      "edit-message-" +
      encodedId
    );


  if (
    !nameInput ||
    !descriptionInput ||
    !categoryInput ||
    !adLevelInput
  ) {

    return;

  }


  const fileName =
    nameInput.value.trim();


  const description =
    descriptionInput.value.trim();


  const category =
    categoryInput.value;


  const adLevel =
    Number(
      adLevelInput.value
    );


  if (!fileName) {

    message.textContent =
      "File name is required.";

    message.className =
      "status-message error-message";

    return;

  }


  message.textContent =
    "Saving...";

  message.className =
    "status-message";


  try {

    /*
     * Ownership is enforced by the
     * database RLS policy.
     */

    const {
      error
    } =
      await supabaseClient

        .from("files")

        .update({

          file_name:
            fileName,

          description:
            description,

          category:
            category,

          ad_level:
            adLevel

        })

        .eq(
          "id",
          fileId
        )

        .eq(
          "creator_id",
          currentUser.id
        );


    if (error) {

      console.error(
        "Edit error:",
        error
      );

      throw new Error(
        error.message ||
        "Could not update file."
      );

    }


    message.textContent =
      "Changes saved.";

    message.className =
      "status-message success-message";


    setTimeout(
      function() {

        loadDashboard();

      },
      600
    );


  } catch (error) {

    console.error(
      error
    );


    message.textContent =
      error.message ||
      "Could not save changes.";

    message.className =
      "status-message error-message";

  }

}


/* =========================================
   DELETE FILE
========================================= */

async function deleteFile(fileId) {

  if (!currentUser) {

    window.location.replace(
      "../login.html"
    );

    return;

  }


  const confirmed =
    window.confirm(
      "Delete this file permanently?\n\nThis will remove the file from your KaroPays library."
    );


  if (!confirmed) {
    return;
  }


  try {

    dashboardMessage.textContent =
      "Deleting file...";

    dashboardMessage.className =
      "status-message";


    /*
     * First get the storage path.
     */

    const {
      data: file,
      error: fetchError
    } =
      await supabaseClient

        .from("files")

        .select(
          "id,storage_path"
        )

        .eq(
          "id",
          fileId
        )

        .eq(
          "creator_id",
          currentUser.id
        )

        .single();


    if (fetchError || !file) {

      throw new Error(
        fetchError?.message ||
        "File not found."
      );

    }


    /*
     * Delete Storage object first.
     */

    if (file.storage_path) {

      const {
        error: storageError
      } =
        await supabaseClient.storage

          .from("files")

          .remove([
            file.storage_path
          ]);


      if (storageError) {

        console.error(
          "Storage delete error:",
          storageError
        );

        throw new Error(
          "Could not delete the stored file: " +
          storageError.message
        );

      }

    }


    /*
     * Delete database record.
     */

    const {
      error: databaseError
    } =
      await supabaseClient

        .from("files")

        .delete()

        .eq(
          "id",
          fileId
        )

        .eq(
          "creator_id",
          currentUser.id
        );


    if (databaseError) {

      console.error(
        "Database delete error:",
        databaseError
      );

      throw new Error(
        "Storage was deleted, but the database record could not be deleted: " +
        databaseError.message
      );

    }


    dashboardMessage.textContent =
      "File deleted successfully.";

    dashboardMessage.className =
      "status-message success-message";


    await loadDashboard();


  } catch (error) {

    console.error(
      "Delete error:",
      error
    );


    dashboardMessage.textContent =
      error.message ||
      "Could not delete the file.";

    dashboardMessage.className =
      "status-message error-message";

  }

}


/* =========================================
   REFRESH
========================================= */

refreshButton.addEventListener(
  "click",
  async function() {

    refreshButton.disabled =
      true;

    refreshButton.textContent =
      "Refreshing...";


    await loadDashboard();


    refreshButton.disabled =
      false;

    refreshButton.textContent =
      "Refresh";

  }
);


/* =========================================
   SIGN OUT
========================================= */

signOut.addEventListener(
  "click",
  async function(event) {

    event.preventDefault();


    signOut.textContent =
      "Signing out...";


    const {
      error
    } =
      await supabaseClient.auth.signOut();


    if (error) {

      console.error(
        "Sign out error:",
        error
      );

      signOut.textContent =
        "Sign out";

      return;

    }


    window.location.replace(
      "../login.html"
    );

  }
);


/* =========================================
   MONEY FORMAT
========================================= */

function formatMoney(value) {

  return (
    "₹" +
    Number(
      value || 0
    ).toFixed(8)
  );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value) {

  return String(
    value ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================
   ESCAPE ATTRIBUTE
========================================= */

function escapeAttribute(value) {

  return escapeHtml(
    value
  );

}


/* =========================================
   ESCAPE JAVASCRIPT STRING
========================================= */

function escapeJs(value) {

  return String(
    value ?? ""
  )
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    )
    .replace(
      /\r/g,
      "\\r"
    )
    .replace(
      /\n/g,
      "\\n"
    );

}

</script>
