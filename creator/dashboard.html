<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Creator Dashboard — KaroPays</title>

  <link
    rel="stylesheet"
    href="../assets/css/pro.css"
  >

  <style>

    .file-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .file-actions button,
    .file-actions a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 14px;
      border-radius: 8px;
      border: 1px solid #292d37;
      background: #151820;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      text-decoration: none;
    }

    .file-actions .edit-btn {
      background: #7c5cff;
      border-color: #7c5cff;
    }

    .file-actions .delete-btn {
      background: #32151a;
      border-color: #7d303b;
      color: #ff9ca6;
    }

    .file-actions button:hover,
    .file-actions a:hover {
      opacity: .85;
    }

    .edit-panel {
      display: none;
      margin-top: 18px;
      padding: 20px;
      background: #0c0e13;
      border: 1px solid #292d37;
      border-radius: 12px;
    }

    .edit-panel.open {
      display: block;
    }

    .edit-panel label {
      display: block;
      margin: 14px 0;
      color: #c9ccd2;
      font-size: 13px;
      font-weight: 700;
    }

    .edit-panel input,
    .edit-panel textarea,
    .edit-panel select {
      width: 100%;
      margin-top: 7px;
      background: #101218;
      border: 1px solid #292d37;
      color: #fff;
      border-radius: 8px;
      padding: 11px;
      font: inherit;
    }

    .edit-panel textarea {
      resize: vertical;
    }

    .edit-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .edit-actions button {
      padding: 9px 14px;
      border-radius: 8px;
      border: 0;
      cursor: pointer;
      font-weight: 700;
    }

    .save-edit {
      background: #7c5cff;
      color: #fff;
    }

    .cancel-edit {
      background: #20232b;
      color: #fff;
    }

    .share-message {
      color: #8f7aff;
      font-size: 13px;
      margin-top: 10px;
    }

    .file-divider {
      border: 0;
      border-top: 1px solid rgba(255,255,255,.08);
      margin: 22px 0 0;
    }

  </style>

</head>


<body>


<header class="site-header">

  <a
    class="logo"
    href="../index.html"
  >
    <span class="logo-mark">K</span>
    KaroPays
  </a>


  <nav class="desktop-nav">

    <a href="../payout-rates.html">
      Payout Rates
    </a>

    <a href="../payment-proof.html">
      Payment Proof
    </a>

    <a href="../premium.html">
      Premium
    </a>

    <a
      href="#"
      id="signOut"
    >
      Sign out
    </a>

  </nav>

</header>



<main class="legal-page">


  <div class="section-label">
    CREATOR DASHBOARD
  </div>


  <h1>
    Welcome back.
  </h1>


  <p
    class="lead"
    id="creatorEmail"
  >
    Loading account...
  </p>



  <!-- ================================
       STATISTICS
  ================================= -->

  <div class="rule-grid">


    <div>

      <small>
        Estimated earnings
      </small>

      <h2 id="totalEarnings">
        ₹0.00000000
      </h2>

    </div>


    <div>

      <small>
        Total downloads
      </small>

      <h2 id="totalDownloads">
        0
      </h2>

    </div>


    <div>

      <small>
        Available balance
      </small>

      <h2 id="availableBalance">
        ₹0.00000000
      </h2>

    </div>


  </div>



  <!-- ================================
       FILES
  ================================= -->

  <div
    class="table-card"
    style="margin-top:30px;"
  >


    <h2>
      Your files
    </h2>


    <div id="filesContainer">

      <p class="lead">
        Loading your files...
      </p>

    </div>


    <div style="margin-top:25px;">

      <a
        class="primary"
        href="../upload.html"
      >
        Upload file
      </a>

    </div>


  </div>


</main>



<!-- ================================
     SUPABASE
================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../assets/js/supabase-config.js"></script>



<script>


/* =========================================
   ELEMENTS
========================================= */

const creatorEmail =
  document.getElementById("creatorEmail");

const totalEarnings =
  document.getElementById("totalEarnings");

const totalDownloads =
  document.getElementById("totalDownloads");

const availableBalance =
  document.getElementById("availableBalance");

const filesContainer =
  document.getElementById("filesContainer");

const signOut =
  document.getElementById("signOut");



/* =========================================
   CURRENT USER
========================================= */

let currentUser = null;



/* =========================================
   START
========================================= */

loadDashboard();



/* =========================================
   LOAD DASHBOARD
========================================= */

async function loadDashboard() {

  try {


    /*
     * Check logged-in user.
     */

    const {
      data: {
        user
      },
      error: sessionError
    } =
      await supabaseClient.auth.getUser();


    if (
      sessionError ||
      !user
    ) {

      window.location.href =
        "../login.html";

      return;

    }


    currentUser = user;


    creatorEmail.textContent =
      user.email ||
      "Creator";



    /*
     * Get creator files.
     */

    const {
      data: files,
      error: filesError
    } =
      await supabaseClient

        .from("files")

        .select(
          "id,file_name,file_size,description,category,ad_level,downloads,earnings,status,storage_path,created_at"
        )

        .eq(
          "creator_id",
          user.id
        )

        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (filesError) {

      console.error(
        "Files error:",
        filesError
      );

      throw new Error(
        "Could not load your files."
      );

    }


    const creatorFiles =
      files || [];



    /* =====================================
       CALCULATE TOTALS
    ===================================== */

    let downloads = 0;

    let earnings = 0;


    creatorFiles.forEach(
      function(file) {

        downloads +=
          Number(
            file.downloads || 0
          );

        earnings +=
          Number(
            file.earnings || 0
          );

      }
    );



    /* =====================================
       DISPLAY TOTALS
    ===================================== */

    totalDownloads.textContent =
      downloads.toLocaleString();


    totalEarnings.textContent =
      formatMoney(
        earnings
      );


    availableBalance.textContent =
      formatMoney(
        earnings
      );



    /* =====================================
       DISPLAY FILES
    ===================================== */

    renderFiles(
      creatorFiles
    );


  } catch (error) {

    console.error(
      "Dashboard error:",
      error
    );


    filesContainer.innerHTML =
      `
        <p class="lead">
          ${escapeHtml(
            error.message ||
            "Unable to load dashboard."
          )}
        </p>
      `;

  }

}



/* =========================================
   RENDER FILES
========================================= */

function renderFiles(files) {


  if (!files.length) {

    filesContainer.innerHTML =
      `
        <div class="empty">

          No files yet.

          <br><br>

          Upload your first file
          to start building your library.

        </div>
      `;

    return;

  }



  let html = "";



  files.forEach(
    function(file) {


      const fileUrl =
        new URL(
          "../file.html?id=" +
          encodeURIComponent(file.id),
          window.location.href
        ).href;


      html +=
        `

        <div
          id="file-${escapeHtml(file.id)}"
          style="
            padding:20px 0;
          "
        >


          <h3>

            ${escapeHtml(
              file.file_name ||
              "Unnamed file"
            )}

          </h3>


          <p>

            ${escapeHtml(
              file.category ||
              "Other"
            )}

            ·

            Ad Level
            ${Number(
              file.ad_level || 1
            )}

          </p>


          <p>

            <strong>

              ${Number(
                file.downloads || 0
              ).toLocaleString()}

            </strong>

            downloads

            &nbsp; · &nbsp;

            <strong>

              ${formatMoney(
                Number(
                  file.earnings || 0
                )
              )}

            </strong>

            earnings

          </p>


          <p>

            Status:

            <strong>

              ${escapeHtml(
                file.status ||
                "unknown"
              )}

            </strong>

          </p>



          <!-- ACTIONS -->

          <div class="file-actions">


            <a
              href="../file.html?id=${encodeURIComponent(
                file.id
              )}"
              target="_blank"
            >
              View
            </a>


            <button
              type="button"
              onclick="shareFile(
                ${JSON.stringify(file.id)}
              )"
            >
              Share
            </button>


            <button
              type="button"
              class="edit-btn"
              onclick="toggleEdit(
                ${JSON.stringify(file.id)}
              )"
            >
              Edit
            </button>


            <button
              type="button"
              class="delete-btn"
              onclick="deleteFile(
                ${JSON.stringify(file.id)}
              )"
            >
              Delete
            </button>


          </div>


          <div
            class="share-message"
            id="share-${escapeHtml(file.id)}"
          ></div>



          <!-- EDIT PANEL -->

          <div
            class="edit-panel"
            id="edit-${escapeHtml(file.id)}"
          >


            <h3>
              Edit file
            </h3>


            <label>

              File name

              <input
                type="text"
                id="name-${escapeHtml(file.id)}"
                value="${escapeAttribute(
                  file.file_name || ""
                )}"
              >

            </label>


            <label>

              Description

              <textarea
                id="description-${escapeHtml(file.id)}"
                rows="4"
                maxlength="1000"
              >${escapeHtml(
                file.description || ""
              )}</textarea>

            </label>


            <label>

              Category

              <select
                id="category-${escapeHtml(file.id)}"
              >

                <option
                  value="Presets"
                  ${file.category === "Presets" ? "selected" : ""}
                >
                  Presets
                </option>

                <option
                  value="Templates"
                  ${file.category === "Templates" ? "selected" : ""}
                >
                  Templates
                </option>

                <option
                  value="Wallpapers"
                  ${file.category === "Wallpapers" ? "selected" : ""}
                >
                  Wallpapers
                </option>

                <option
                  value="Resources"
                  ${file.category === "Resources" ? "selected" : ""}
                >
                  Resources
                </option>

                <option
                  value="Other"
                  ${file.category === "Other" ? "selected" : ""}
                >
                  Other
                </option>

              </select>

            </label>


            <label>

              Ad level

              <select
                id="adlevel-${escapeHtml(file.id)}"
              >

                <option
                  value="1"
                  ${Number(file.ad_level) === 1 ? "selected" : ""}
                >
                  1 — Low
                </option>

                <option
                  value="2"
                  ${Number(file.ad_level) === 2 ? "selected" : ""}
                >
                  2 — Medium
                </option>

                <option
                  value="3"
                  ${Number(file.ad_level) === 3 ? "selected" : ""}
                >
                  3 — High
                </option>

                <option
                  value="4"
                  ${Number(file.ad_level) === 4 ? "selected" : ""}
                >
                  4 — Ultra
                </option>

              </select>

            </label>


            <div class="edit-actions">

              <button
                type="button"
                class="save-edit"
                onclick="saveEdit(
                  ${JSON.stringify(file.id)}
                )"
              >
                Save changes
              </button>


              <button
                type="button"
                class="cancel-edit"
                onclick="toggleEdit(
                  ${JSON.stringify(file.id)}
                )"
              >
                Cancel
              </button>

            </div>


            <p
              id="edit-message-${escapeHtml(file.id)}"
            ></p>


          </div>


          <hr class="file-divider">


        </div>

        `;

    }
  );


  filesContainer.innerHTML =
    html;

}



/* =========================================
   SHARE FILE
========================================= */

async function shareFile(fileId) {


  const fileUrl =
    new URL(
      "../file.html?id=" +
      encodeURIComponent(fileId),
      window.location.href
    ).href;


  const message =
    document.getElementById(
      "share-" + fileId
    );


  try {


    if (
      navigator.clipboard &&
      window.isSecureContext
    ) {

      await navigator.clipboard.writeText(
        fileUrl
      );

    } else {

      /*
       * Fallback for browsers where
       * Clipboard API is unavailable.
       */

      const input =
        document.createElement("input");

      input.value =
        fileUrl;

      document.body.appendChild(
        input
      );

      input.select();

      document.execCommand(
        "copy"
      );

      input.remove();

    }


    message.textContent =
      "✓ File link copied!";


    setTimeout(
      function() {

        message.textContent =
          "";

      },
      2500
    );


  } catch (error) {

    console.error(
      "Share error:",
      error
    );


    /*
     * If clipboard fails, show
     * the link so the creator
     * can copy it manually.
     */

    message.textContent =
      fileUrl;

  }

}



/* =========================================
   TOGGLE EDIT
========================================= */

function toggleEdit(fileId) {


  const panel =
    document.getElementById(
      "edit-" + fileId
    );


  if (!panel) return;


  panel.classList.toggle(
    "open"
  );

}



/* =========================================
   SAVE EDIT
========================================= */

async function saveEdit(fileId) {


  if (!currentUser) {

    alert(
      "You are not logged in."
    );

    return;

  }


  const nameInput =
    document.getElementById(
      "name-" + fileId
    );


  const descriptionInput =
    document.getElementById(
      "description-" + fileId
    );


  const categoryInput =
    document.getElementById(
      "category-" + fileId
    );


  const adLevelInput =
    document.getElementById(
      "adlevel-" + fileId
    );


  const message =
    document.getElementById(
      "edit-message-" + fileId
    );


  const fileName =
    nameInput.value.trim();


  const description =
    descriptionInput.value.trim();


  const category =
    categoryInput.value;


  const adLevel =
    Number(
      adLevelInput.value
    );


  if (!fileName) {

    message.textContent =
      "File name is required.";

    return;

  }


  message.textContent =
    "Saving...";


  try {


    /*
     * Update only this creator's
     * own file.
     */

    const {
      error
    } =
      await supabaseClient

        .from("files")

        .update({

          file_name:
            fileName,

          description:
            description,

          category:
            category,

          ad_level:
            adLevel

        })

        .eq(
          "id",
          fileId
        )

        .eq(
          "creator_id",
          currentUser.id
        );


    if (error) {

      console.error(
        "Edit error:",
        error
      );

      throw new Error(
        error.message ||
        "Could not save changes."
      );

    }


    message.textContent =
      "✓ Changes saved.";


    /*
     * Reload dashboard so
     * displayed data is fresh.
     */

    setTimeout(
      function() {

        loadDashboard();

      },
      700
    );


  } catch (error) {

    console.error(
      error
    );


    message.textContent =
      error.message ||
      "Could not save changes.";

  }

}



/* =========================================
   DELETE FILE
========================================= */

async function deleteFile(fileId) {


  if (!currentUser) {

    alert(
      "You are not logged in."
    );

    return;

  }


  /*
   * Confirmation.
   */

  const confirmed =
    confirm(
      "Are you sure you want to delete this file?\n\nThe file will be removed from KaroPays and its stored file will also be deleted.\n\nThis cannot be undone."
    );


  if (!confirmed) {

    return;

  }


  try {


    /*
     * Get the file first.
     *
     * This lets us obtain the
     * storage_path.
     */

    const {
      data: file,
      error: fileError
    } =
      await supabaseClient

        .from("files")

        .select(
          "id,storage_path"
        )

        .eq(
          "id",
          fileId
        )

        .eq(
          "creator_id",
          currentUser.id
        )

        .single();


    if (fileError) {

      console.error(
        "Get file before delete:",
        fileError
      );

      throw new Error(
        "Could not find the file."
      );

    }


    /*
     * Remove Storage file first.
     */

    if (
      file.storage_path
    ) {


      const {
        error: storageError
      } =
        await supabaseClient.storage

          .from("files")

          .remove([
            file.storage_path
          ]);


      if (storageError) {

        console.error(
          "Storage delete error:",
          storageError
        );

        throw new Error(
          "Could not delete the stored file: " +
          storageError.message
        );

      }

    }


    /*
     * Remove database record.
     */

    const {
      error: databaseError
    } =
      await supabaseClient

        .from("files")

        .delete()

        .eq(
          "id",
          fileId
        )

        .eq(
          "creator_id",
          currentUser.id
        );


    if (databaseError) {

      console.error(
        "Database delete error:",
        databaseError
      );

      throw new Error(
        "The Storage file was deleted, but the database record could not be removed: " +
        databaseError.message
      );

    }


    /*
     * Refresh dashboard.
     */

    await loadDashboard();


  } catch (error) {

    console.error(
      "Delete error:",
      error
    );


    alert(
      error.message ||
      "Could not delete the file."
    );

  }

}



/* =========================================
   MONEY FORMAT
========================================= */

function formatMoney(value) {


  return (
    "₹" +
    Number(
      value || 0
    ).toFixed(8)
  );

}



/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value) {


  return String(
    value
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



/* =========================================
   ESCAPE ATTRIBUTE
========================================= */

function escapeAttribute(value) {

  return escapeHtml(value);

}



/* =========================================
   SIGN OUT
========================================= */

signOut.addEventListener(
  "click",
  async function(event) {


    event.preventDefault();


    await supabaseClient.auth.signOut();


    window.location.href =
      "../login.html";

  }
);


</script>
