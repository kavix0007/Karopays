<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Creator Dashboard — KaroPays</title>

  <link
    rel="stylesheet"
    href="../assets/css/pro.css"
  >

</head>


<body>

<header class="site-header">

  <a
    class="logo"
    href="../index.html"
  >
    <span class="logo-mark">K</span>
    KaroPays
  </a>


  <nav class="desktop-nav">

    <a href="../payout-rates.html">
      Payout Rates
    </a>

    <a href="../payment-proof.html">
      Payment Proof
    </a>

    <a href="../premium.html">
      Premium
    </a>

    <a
      href="#"
      id="signOut"
    >
      Sign out
    </a>

  </nav>

</header>


<main class="legal-page">

  <div class="section-label">
    CREATOR DASHBOARD
  </div>


  <h1>
    Welcome back.
  </h1>


  <p
    class="lead"
    id="creatorEmail"
  >
    Loading account...
  </p>


  <!-- =====================================
       STATISTICS
  ====================================== -->

  <div class="rule-grid">

    <div>

      <small>
        Estimated earnings
      </small>

      <h2 id="totalEarnings">
        ₹0.00000000
      </h2>

    </div>


    <div>

      <small>
        Total downloads
      </small>

      <h2 id="totalDownloads">
        0
      </h2>

    </div>


    <div>

      <small>
        Available balance
      </small>

      <h2 id="availableBalance">
        ₹0.00000000
      </h2>

    </div>

  </div>


  <!-- =====================================
       FILES
  ====================================== -->

  <div
    class="table-card"
    style="margin-top:30px;"
  >

    <div
      style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:15px;
        flex-wrap:wrap;
      "
    >

      <h2>
        Your files
      </h2>


      <a
        class="primary"
        href="../upload.html"
      >
        + Upload file
      </a>

    </div>


    <div
      id="filesContainer"
      style="margin-top:20px;"
    >

      <p class="lead">
        Loading your files...
      </p>

    </div>

  </div>


</main>


<!-- =====================================
     SUPABASE
====================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../assets/js/supabase-config.js"></script>


<script>

/* =========================================
   ELEMENTS
========================================= */

const creatorEmail =
  document.getElementById("creatorEmail");

const totalEarnings =
  document.getElementById("totalEarnings");

const totalDownloads =
  document.getElementById("totalDownloads");

const availableBalance =
  document.getElementById("availableBalance");

const filesContainer =
  document.getElementById("filesContainer");

const signOut =
  document.getElementById("signOut");


/* =========================================
   CURRENT USER
========================================= */

let currentUser = null;


/* =========================================
   START DASHBOARD
========================================= */

loadDashboard();


/* =========================================
   LOAD DASHBOARD
========================================= */

async function loadDashboard() {

  try {

    /*
     * Check logged-in user.
     */

    const {
      data: {
        user
      },
      error: sessionError
    } =
      await supabaseClient.auth.getUser();


    if (
      sessionError ||
      !user
    ) {

      window.location.href =
        "../login.html";

      return;

    }


    currentUser =
      user;


    creatorEmail.textContent =
      user.email ||
      "Creator";


    /*
     * Get creator files.
     */

    const {
      data: files,
      error: filesError
    } =
      await supabaseClient

        .from("files")

        .select(
          "id,file_name,file_size,category,ad_level,downloads,earnings,status,created_at,storage_path"
        )

        .eq(
          "creator_id",
          user.id
        )

        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (filesError) {

      console.error(
        "Files error:",
        filesError
      );

      throw new Error(
        "Could not load your files."
      );

    }


    const creatorFiles =
      files || [];


    /* =====================================
       CALCULATE TOTALS
    ===================================== */

    let downloads = 0;

    let earnings = 0;


    creatorFiles.forEach(
      function(file) {

        downloads +=
          Number(
            file.downloads || 0
          );


        earnings +=
          Number(
            file.earnings || 0
          );

      }
    );


    /* =====================================
       DISPLAY TOTALS
    ===================================== */

    totalDownloads.textContent =
      downloads.toLocaleString();


    totalEarnings.textContent =
      formatMoney(
        earnings
      );


    /*
     * Until the payout system is built,
     * available balance equals earnings.
     */

    availableBalance.textContent =
      formatMoney(
        earnings
      );


    /* =====================================
       DISPLAY FILES
    ===================================== */

    renderFiles(
      creatorFiles
    );


  } catch (error) {

    console.error(
      "Dashboard error:",
      error
    );


    filesContainer.innerHTML =
      `
        <p class="lead">
          ${escapeHtml(
            error.message ||
            "Unable to load dashboard."
          )}
        </p>
      `;

  }

}


/* =========================================
   RENDER FILES
========================================= */

function renderFiles(files) {

  if (!files.length) {

    filesContainer.innerHTML =
      `
        <div class="empty">

          <p>
            No files yet.
          </p>

          <a
            class="primary"
            href="../upload.html"
          >
            Upload your first file
          </a>

        </div>
      `;

    return;

  }


  let html = "";


  files.forEach(
    function(file) {

      const fileUrl =
        new URL(
          "../file.html?id=" +
          encodeURIComponent(
            file.id
          ),
          window.location.href
        ).href;


      html +=
        `
        <div
          class="panel"
          id="file-${escapeHtml(
            file.id
          )}"
          style="
            margin-bottom:18px;
          "
        >

          <!-- FILE HEADER -->

          <div
            style="
              display:flex;
              justify-content:space-between;
              align-items:flex-start;
              gap:20px;
              flex-wrap:wrap;
            "
          >

            <div>

              <h3
                style="
                  margin:0 0 8px;
                "
              >
                ${escapeHtml(
                  file.file_name ||
                  "Unnamed file"
                )}
              </h3>


              <p
                style="
                  margin:0;
                  color:#9298a4;
                "
              >

                ${escapeHtml(
                  file.category ||
                  "Other"
                )}

                ·

                Ad Level ${Number(
                  file.ad_level || 1
                )}

              </p>

            </div>


            <!-- STATUS -->

            <span
              style="
                padding:7px 10px;
                border:1px solid #292d37;
                border-radius:8px;
                color:#a9aeb8;
                font-size:12px;
              "
            >
              ${escapeHtml(
                file.status ||
                "unknown"
              )}
            </span>

          </div>


          <!-- FILE STATS -->

          <div
            class="file-meta"
            style="
              margin-top:18px;
            "
          >

            <span>
              Downloads:
              <strong>
                ${Number(
                  file.downloads || 0
                ).toLocaleString()}
              </strong>
            </span>


            <span>
              Earnings:
              <strong>
                ${formatMoney(
                  file.earnings
                )}
              </strong>
            </span>


            <span>
              Size:
              <strong>
                ${formatFileSize(
                  file.file_size
                )}
              </strong>
            </span>

          </div>


          <!-- ACTIONS -->

          <div
            style="
              display:flex;
              gap:10px;
              flex-wrap:wrap;
              margin-top:20px;
            "
          >

            <!-- VIEW -->

            <a
              class="btn small"
              href="../file.html?id=${encodeURIComponent(
                file.id
              )}"
            >
              View
            </a>


            <!-- SHARE -->

            <button
              type="button"
              class="btn small ghost"
              onclick="shareFile(
                '${escapeJs(fileUrl)}',
                this
              )"
            >
              Share
            </button>


            <!-- EDIT -->

            <a
              class="btn small ghost"
              href="edit-file.html?id=${encodeURIComponent(
                file.id
              )}"
            >
              Edit
            </a>


            <!-- DELETE -->

            <button
              type="button"
              class="btn small ghost"
              onclick="deleteFile(
                '${escapeJs(file.id)}',
                '${escapeJs(file.storage_path || "")}',
                this
              )"
            >
              Delete
            </button>

          </div>


          <!-- SHARE URL -->

          <div
            style="
              margin-top:15px;
            "
          >

            <input
              type="text"
              readonly
              value="${escapeHtml(
                fileUrl
              )}"
              onclick="this.select()"
              style="
                width:100%;
                background:#0e1015;
                border:1px solid #292d37;
                color:#a9aeb8;
                border-radius:8px;
                padding:11px;
              "
            >

          </div>

        </div>
        `;

    }
  );


  filesContainer.innerHTML =
    html;

}


/* =========================================
   SHARE FILE
========================================= */

async function shareFile(
  fileUrl,
  button
) {

  const originalText =
    button.textContent;


  try {

    /*
     * Use native share if available.
     */

    if (
      navigator.share
    ) {

      await navigator.share({

        title:
          "KaroPays File",

        text:
          "Download this file from KaroPays.",

        url:
          fileUrl

      });


      button.textContent =
        "Shared";


      setTimeout(
        function() {

          button.textContent =
            originalText;

        },
        1500
      );


      return;

    }


    /*
     * Fallback to clipboard.
     */

    await navigator.clipboard.writeText(
      fileUrl
    );


    button.textContent =
      "Link Copied";


    setTimeout(
      function() {

        button.textContent =
          originalText;

      },
      1500
    );


  } catch (error) {

    console.error(
      "Share error:",
      error
    );


    /*
     * Some browsers block
     * navigator.clipboard.
     *
     * Try the older fallback.
     */

    try {

      const temp =
        document.createElement(
          "textarea"
        );


      temp.value =
        fileUrl;


      document.body.appendChild(
        temp
      );


      temp.select();


      document.execCommand(
        "copy"
      );


      temp.remove();


      button.textContent =
        "Link Copied";


      setTimeout(
        function() {

          button.textContent =
            originalText;

        },
        1500
      );


    } catch (fallbackError) {

      console.error(
        "Clipboard fallback error:",
        fallbackError
      );


      alert(
        "Copy failed. File link:\n\n" +
        fileUrl
      );

    }

  }

}


/* =========================================
   DELETE FILE
========================================= */

async function deleteFile(
  fileId,
  storagePath,
  button
) {

  /*
   * Safety confirmation.
   */

  const confirmed =
    confirm(
      "Are you sure you want to delete this file?\n\n" +
      "This will permanently remove the file from KaroPays and cannot be undone."
    );


  if (!confirmed) {

    return;

  }


  /*
   * Make sure user is still logged in.
   */

  const {
    data: {
      user
    },
    error: userError
  } =
    await supabaseClient.auth.getUser();


  if (
    userError ||
    !user
  ) {

    alert(
      "Your session has expired. Please sign in again."
    );


    window.location.href =
      "../login.html";


    return;

  }


  /*
   * Make sure this is
   * the current creator.
   */

  if (
    user.id !== currentUser?.id
  ) {

    alert(
      "Permission denied."
    );


    return;

  }


  const originalText =
    button.textContent;


  button.disabled =
    true;


  button.textContent =
    "Deleting...";


  try {

    /*
     * STEP 1
     *
     * Delete database record.
     *
     * We use both ID and creator_id
     * so another creator's file
     * cannot be deleted.
     */

    const {
      error: databaseError
    } =
      await supabaseClient

        .from("files")

        .delete()

        .eq(
          "id",
          fileId
        )

        .eq(
          "creator_id",
          user.id
        );


    if (databaseError) {

      console.error(
        "Database delete error:",
        databaseError
      );


      throw new Error(
        "Could not delete the file record: " +
        databaseError.message
      );

    }


    /*
     * STEP 2
     *
     * Delete actual Storage file.
     */

    if (
      storagePath
    ) {

      const {
        error: storageError
      } =
        await supabaseClient.storage

          .from("files")

          .remove([
            storagePath
          ]);


      if (storageError) {

        /*
         * Database record has already
         * been deleted.
         *
         * Don't pretend the Storage
         * deletion succeeded.
         */

        console.error(
          "Storage delete error:",
          storageError
        );


        alert(
          "The database record was deleted, but the stored file could not be removed.\n\n" +
          "Storage error: " +
          storageError.message
        );


      }

    }


    /*
     * Remove file card from page.
     */

    const card =
      document.getElementById(
        "file-" +
        fileId
      );


    if (card) {

      card.remove();

    }


    /*
     * Recalculate dashboard.
     */

    await loadDashboard();


  } catch (error) {

    console.error(
      "Delete error:",
      error
    );


    alert(
      error.message ||
      "Unable to delete file."
    );


    button.disabled =
      false;


    button.textContent =
      originalText;

  }

}


/* =========================================
   MONEY FORMAT
========================================= */

function formatMoney(
  value
) {

  return (
    "₹" +
    Number(
      value || 0
    ).toFixed(8)
  );

}


/* =========================================
   FILE SIZE
========================================= */

function formatFileSize(
  bytes
) {

  if (
    bytes === null ||
    bytes === undefined ||
    Number(bytes) <= 0
  ) {

    return "—";

  }


  const units = [
    "B",
    "KB",
    "MB",
    "GB",
    "TB"
  ];


  let size =
    Number(bytes);


  let unit =
    0;


  while (
    size >= 1024 &&
    unit < units.length - 1
  ) {

    size =
      size / 1024;

    unit++;

  }


  return (
    size.toFixed(
      size >= 10 || unit === 0
        ? 0
        : 1
    )
    + " "
    + units[unit]
  );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(
  value
) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================
   ESCAPE JAVASCRIPT
========================================= */

function escapeJs(
  value
) {

  return String(value)
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    )
    .replace(
      /"/g,
      '\\"'
    )
    .replace(
      /\r/g,
      "\\r"
    )
    .replace(
      /\n/g,
      "\\n"
    );

}


/* =========================================
   SIGN OUT
========================================= */

signOut.addEventListener(
  "click",
  async function(event) {

    event.preventDefault();


    await supabaseClient.auth.signOut();


    window.location.href =
      "../login.html";

  }
);

</script>

</body>

</html>
