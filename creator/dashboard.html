<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Creator Dashboard — KaroPays</title>

  <link
    rel="stylesheet"
    href="../assets/css/pro.css"
  >

</head>

<body>

<header class="site-header">

  <a
    class="logo"
    href="../index.html"
  >
    <span class="logo-mark">K</span>
    KaroPays
  </a>

  <nav class="desktop-nav">

    <a href="../payout-rates.html">
      Payout Rates
    </a>

    <a href="../payment-proof.html">
      Payment Proof
    </a>

    <a href="../premium.html">
      Premium
    </a>

    <a href="#"
       id="signOut">
      Sign out
    </a>

  </nav>

</header>


<main class="legal-page">

  <div class="section-label">
    CREATOR DASHBOARD
  </div>


  <h1>
    Welcome back.
  </h1>


  <p
    class="lead"
    id="creatorEmail"
  >
    Loading account...
  </p>


  <!-- Statistics -->

  <div class="rule-grid">

    <div>

      <small>
        Estimated earnings
      </small>

      <h2 id="totalEarnings">
        ₹0.00000000
      </h2>

    </div>


    <div>

      <small>
        Total downloads
      </small>

      <h2 id="totalDownloads">
        0
      </h2>

    </div>


    <div>

      <small>
        Available balance
      </small>

      <h2 id="availableBalance">
        ₹0.00000000
      </h2>

    </div>

  </div>


  <!-- Files -->

  <div
    class="table-card"
    style="margin-top:30px;"
  >

    <h2>
      Your files
    </h2>


    <div id="filesContainer">

      <p class="lead">
        Loading your files...
      </p>

    </div>


    <div style="margin-top:25px;">

      <a
        class="primary"
        href="../upload.html"
      >
        Upload file
      </a>

    </div>

  </div>

</main>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../assets/js/supabase-config.js"></script>


<script>

/* =========================================
   ELEMENTS
========================================= */

const creatorEmail =
  document.getElementById("creatorEmail");

const totalEarnings =
  document.getElementById("totalEarnings");

const totalDownloads =
  document.getElementById("totalDownloads");

const availableBalance =
  document.getElementById("availableBalance");

const filesContainer =
  document.getElementById("filesContainer");

const signOut =
  document.getElementById("signOut");


/* =========================================
   START
========================================= */

loadDashboard();


/* =========================================
   LOAD DASHBOARD
========================================= */

async function loadDashboard() {

  try {

    /*
     * Check logged-in user.
     */

    const {
      data: {
        user
      },
      error: sessionError
    } = await supabaseClient.auth.getUser();


    if (
      sessionError ||
      !user
    ) {

      window.location.href =
        "../login.html";

      return;

    }


    creatorEmail.textContent =
      user.email ||
      "Creator";


    /*
     * Get this creator's files.
     */

    const {
      data: files,
      error: filesError
    } = await supabaseClient

      .from("files")

      .select(
        "id,file_name,file_size,category,ad_level,downloads,earnings,status,created_at"
      )

      .eq(
        "creator_id",
        user.id
      )

      .order(
        "created_at",
        {
          ascending: false
        }
      );


    if (filesError) {

      console.error(
        "Files error:",
        filesError
      );

      throw new Error(
        "Could not load your files."
      );

    }


    const creatorFiles =
      files || [];


    /* =====================================
       CALCULATE TOTALS
    ===================================== */

    let downloads = 0;

    let earnings = 0;


    creatorFiles.forEach(
      function(file) {

        downloads +=
          Number(
            file.downloads || 0
          );

        earnings +=
          Number(
            file.earnings || 0
          );

      }
    );


    /* =====================================
       DISPLAY TOTALS
    ===================================== */

    totalDownloads.textContent =
      downloads.toLocaleString();


    totalEarnings.textContent =
      formatMoney(
        earnings
      );


    /*
     * Until the payout system is built,
     * available balance equals earnings.
     */

    availableBalance.textContent =
      formatMoney(
        earnings
      );


    /* =====================================
       DISPLAY FILES
    ===================================== */

    renderFiles(
      creatorFiles
    );


  } catch (error) {

    console.error(
      "Dashboard error:",
      error
    );

    filesContainer.innerHTML =
      `
        <p class="lead">
          ${escapeHtml(
            error.message ||
            "Unable to load dashboard."
          )}
        </p>
      `;

  }

}


/* =========================================
   RENDER FILES
========================================= */

function renderFiles(files) {

  if (!files.length) {

    filesContainer.innerHTML =
      `
        <p class="lead">
          No files yet. Upload your first
          file to start building your library.
        </p>
      `;

    return;

  }


  let html = "";


  files.forEach(
    function(file) {

      html +=
        `
        <div
          style="
            padding:20px 0;
            border-bottom:1px solid rgba(0,0,0,.08);
          "
        >

          <h3>
            ${escapeHtml(
              file.file_name ||
              "Unnamed file"
            )}
          </h3>

          <p>
            ${escapeHtml(
              file.category ||
              "Other"
            )}
            ·
            Ad Level ${Number(
              file.ad_level || 1
            )}
          </p>

          <p>

            <strong>
              ${Number(
                file.downloads || 0
              ).toLocaleString()}
            </strong>

            downloads

            &nbsp; · &nbsp;

            <strong>
              ${formatMoney(
                Number(
                  file.earnings || 0
                )
              )}
            </strong>

            earnings

          </p>

          <p>

            Status:
            <strong>
              ${escapeHtml(
                file.status ||
                "unknown"
              )}
            </strong>

          </p>

          <a
            href="../file.html?id=${encodeURIComponent(
              file.id
            )}"
          >
            View file page
          </a>

        </div>
        `;

    }
  );


  filesContainer.innerHTML =
    html;

}


/* =========================================
   MONEY FORMAT
========================================= */

function formatMoney(value) {

  return (
    "₹" +
    Number(value || 0)
      .toFixed(8)
  );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================
   SIGN OUT
========================================= */

signOut.addEventListener(
  "click",
  async function(event) {

    event.preventDefault();

    await supabaseClient.auth.signOut();

    window.location.href =
      "../login.html";

  }
);

</script>

</body>

</html>
