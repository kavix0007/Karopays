<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Create Account — KaroPays</title>
  <link rel="stylesheet" href="assets/css/pro.css">
</head>

<body>

<main class="auth-wrap">

  <a class="logo" href="index.html">
    <span class="logo-mark">K</span>
    KaroPays
  </a>

  <form class="auth-card" id="registerForm">

    <div class="section-label">CREATE ACCOUNT</div>

    <h1>Start earning from your files.</h1>

    <label>
      Name
      <input
        id="displayName"
        type="text"
        required
        autocomplete="name"
      >
    </label>

    <label>
      Email
      <input
        id="email"
        type="email"
        required
        autocomplete="email"
      >
    </label>

    <label>
      Password
      <input
        id="password"
        type="password"
        required
        minlength="6"
        autocomplete="new-password"
      >
    </label>

    <label class="check">
      <input id="terms" type="checkbox" required>
      I agree to the Program Rules and Terms.
    </label>

    <p id="registerMessage"></p>

    <button class="primary full" type="submit">
      Create account
    </button>

    <p>
      Already have an account?
      <a href="login.html">Sign in</a>
    </p>

  </form>

</main>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>

<!-- KaroPays registration -->
<script>
const registerForm = document.getElementById("registerForm");
const registerMessage = document.getElementById("registerMessage");

registerForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  const displayName =
    document.getElementById("displayName").value.trim();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  registerMessage.textContent = "Creating your account...";

  const { data, error } = await supabaseClient.auth.signUp({
    email: email,
    password: password,
    options: {
      data: {
        display_name: displayName
      }
    }
  });

  if (error) {
    registerMessage.textContent = error.message;
    return;
  }

  if (data.user) {
    registerMessage.textContent =
      "Account created successfully. Check your email if confirmation is required.";

    registerForm.reset();
  }
});
</script>

</body>
</html>
