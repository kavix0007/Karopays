<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Create Account — KaroPays</title>
  <link rel="stylesheet" href="assets/css/pro.css">

<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon.png">
<link rel="apple-touch-icon" sizes="192x192" href="/assets/img/favicon-192.png">
<meta name="theme-color" content="#5271ff">
</head>

<body>

<main class="auth-wrap">

  <a class="logo" href="index.html">
    <img class="logo-img" src="assets/img/karopays-logo.png" alt="KaroPays" width="112" height="52">
  </a>

  <form class="auth-card" id="registerForm">

    <div class="section-label">CREATE ACCOUNT</div>

    <h1>Start earning from your files.</h1>

    <label>
      Name
      <input
        id="displayName"
        type="text"
        required
        autocomplete="name"
      >
    </label>

    <label>
      Email
      <input
        id="email"
        type="email"
        required
        autocomplete="email"
      >
    </label>

    <label>
      Password
      <input
        id="password"
        type="password"
        required
        minlength="8"
        autocomplete="new-password"
      >
    </label>

    <label class="check">
      <input id="terms" type="checkbox" required>
      I agree to the <a href="program-rules.html" target="_blank" rel="noopener">Program Rules</a> and <a href="terms.html" target="_blank" rel="noopener">Terms</a>.
    </label>

    <p id="registerMessage" class="form-message" role="status" aria-live="polite"></p>

    <button class="primary full" id="registerButton" type="submit">
      Create account
    </button>

    <p>
      Already have an account?
      <a href="login.html">Sign in</a>
    </p>

  </form>

</main>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>

<!-- KaroPays registration -->
<script>
const registerForm = document.getElementById("registerForm");
const registerMessage = document.getElementById("registerMessage");
const registerButton = document.getElementById("registerButton");

function showRegisterMessage(message, type = "info") {
  registerMessage.textContent = message;
  registerMessage.dataset.state = type;
}

registerForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  if (typeof supabaseClient === "undefined" || !supabaseClient?.auth) {
    showRegisterMessage("Registration is temporarily unavailable. Please refresh the page and try again.", "error");
    return;
  }

  const displayName = document.getElementById("displayName").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!displayName) {
    showRegisterMessage("Please enter your name.", "error");
    return;
  }

  registerButton.disabled = true;
  registerButton.textContent = "Creating account...";
  showRegisterMessage("Creating your account and sending the confirmation email…");

  try {
    const { data, error } = await supabaseClient.auth.signUp({
      email,
      password,
      options: {
        emailRedirectTo: `${window.location.origin}/login.html`,
        data: { display_name: displayName }
      }
    });

    if (error) {
      showRegisterMessage(error.message || "We couldn't create your account. Please try again.", "error");
      return;
    }

    if (data.user && !data.session) {
      showRegisterMessage(
        `Your account request was received. We sent a confirmation link to ${email}. Open that email and click “Confirm email address” before signing in. Check Spam/Junk too. If it doesn't arrive, wait a few minutes before trying again.`,
        "success"
      );
      document.getElementById("password").value = "";
      document.getElementById("terms").checked = false;
      return;
    }

    if (data.user && data.session) {
      showRegisterMessage("Your account was created and you are signed in. Redirecting to your dashboard…", "success");
      window.location.assign("creator/dashboard.html");
      return;
    }

    showRegisterMessage("We couldn't confirm the registration result. Please try signing in or try again later.", "error");
  } catch (error) {
    showRegisterMessage(
      error?.message || "A network error occurred. Check your connection and try again.",
      "error"
    );
  } finally {
    registerButton.disabled = false;
    registerButton.textContent = "Create account";
  }
});
</script>

</body>
</html>
