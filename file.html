<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>File — KaroPays</title>
<link rel="stylesheet" href="assets/css/pro.css">
</head>
<body>
<header class="site-header">
<a class="logo" href="index.html"><span class="logo-mark">K</span>KaroPays</a>
<nav class="desktop-nav">
<a href="payout-rates.html">Payout Rates</a>
<a href="payment-proof.html">Payment Proof</a>
<a href="premium.html">Premium</a>
<a href="login.html">Sign in</a>
</nav>
</header>

<main class="legal-page">
<div id="state">
<div class="section-label">KAROPAYS FILE</div>
<h1>Loading file...</h1>
<p class="lead">Please wait.</p>
</div>

<section id="content" style="display:none">
<div class="file-hero">
<div class="eyebrow" id="cat">FILE</div>
<h1 id="name"></h1>
<p class="lead" id="desc"></p>
<div class="file-meta" id="meta"></div>
<div class="actions">
<button class="primary" id="download">Download file</button>
<button class="secondary" id="share">Share file</button>
</div>
<p id="message" class="form-message"></p>
</div>
<div class="ad-box">ADVERTISEMENT</div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script>
const id=new URLSearchParams(location.search).get('id');
let file;
const $=x=>document.getElementById(x);

load();

async function load(){
  if(!id)return error();

  const{data:f,error:e}=await supabaseClient
    .from('files')
    .select('id,file_name,file_size,description,category,ad_level,downloads,status,storage_path')
    .eq('id',id)
    .eq('status','active')
    .single();

  if(e||!f)return error();

  file=f;

  $('name').textContent=f.file_name||'Unnamed file';
  $('desc').textContent=f.description||'No description provided.';
  $('cat').textContent=f.category||'FILE';

  $('meta').innerHTML=`
    <span>${esc(f.category||'Other')}</span>
    <span>${bytes(f.file_size)}</span>
    <span>${(+f.downloads||0).toLocaleString()} downloads</span>
    <span>Ad Level ${+f.ad_level||1}</span>
  `;

  $('state').style.display='none';
  $('content').style.display='block';
}

function error(){
  $('state').innerHTML=`
    <div class="section-label">FILE</div>
    <h1>File unavailable</h1>
    <p class="lead">This file does not exist or is no longer available.</p>
    <a class="primary" href="index.html">Back to KaroPays</a>
  `;
}

/*
  SECURE DOWNLOAD FLOW:

  Downloader
      ↓
  record-download Edge Function
      ↓
  Downloader IP → Country
      ↓
  File Ad Level
      ↓
  payout_rates
      ↓
  download_earnings

  The browser sends ONLY file_id.
  It cannot choose country, rate, ad level or earning.
*/

$('download').onclick=async()=>{
  if(!file)return;

  const b=$('download');
  b.disabled=true;
  b.textContent='Preparing download...';

  try{

    const{data:result,error:recordError}=
      await supabaseClient.functions.invoke(
        'record-download',
        {body:{file_id:file.id}}
      );

    if(recordError)throw recordError;

    if(!result||result.success!==true){
      throw new Error(
        'The download could not be recorded, so the file was not downloaded.'
      );
    }

    const{data:signed,error:signedError}=
      await supabaseClient
        .storage
        .from('files')
        .createSignedUrl(file.storage_path,120);

    if(signedError||!signed?.signedUrl){
      throw signedError||
        new Error('Could not create a download link.');
    }

    $('message').textContent=
      '✓ Download recorded. Your download is starting...';

    location.href=signed.signedUrl;

  }catch(e){
    console.error('KaroPays download error:',e);

    $('message').textContent=
      e?.message||'Could not start the download.';

    b.disabled=false;
    b.textContent='Download file';
  }
};

$('share').onclick=async()=>{
  try{
    if(navigator.share){
      await navigator.share({
        title:file?.file_name||'KaroPays file',
        url:location.href
      });
    }else{
      await navigator.clipboard.writeText(location.href);
      $('message').textContent=
        '✓ File link copied to clipboard.';
    }
  }catch(e){
    if(e.name!=='AbortError'){
      $('message').textContent='Could not share the file.';
    }
  }
};

function bytes(n){
  n=+n||0;
  if(!n)return'0 B';

  const u=['B','KB','MB','GB','TB'];
  const i=Math.floor(Math.log(n)/Math.log(1024));

  return(n/1024**i).toFixed(i?2:0)+' '+u[i];
}

function esc(v){
  return String(v).replace(
    /[&<>'"]/g,
    c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#039;',
      '"':'&quot;'
    }[c])
  );
}
</script>
</body>
</html>
