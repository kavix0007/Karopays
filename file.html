<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unlock File — KaroPays</title>

<style>
:root{color-scheme:light;--kp-ink:var(--ink);--kp-muted:var(--muted);--kp-purple:var(--brand);--kp-purple-dark:var(--brand-dark);--kp-border:var(--line);--kp-bg:var(--bg);--kp-card:#fff}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--kp-bg);color:var(--kp-ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55}






.legal-page{width:min(1080px,calc(100% - 32px));margin:42px auto 72px}
#state{max-width:720px;margin:64px auto;padding:40px 26px;text-align:center;background:white;border:1px solid var(--kp-border);border-radius:24px;box-shadow:0 14px 40px #2a1b5010}
.section-label,.eyebrow{display:inline-flex;align-items:center;gap:7px;color:var(--kp-purple);font-size:11px;font-weight:850;letter-spacing:1.5px;text-transform:uppercase}
#state h1{margin:12px 0 8px;font-size:clamp(24px,4vw,34px);letter-spacing:-1px}
.lead{color:var(--kp-muted);line-height:1.7}
#content{display:block}
.file-hero{position:relative;overflow:hidden;padding:clamp(25px,5vw,52px);background:var(--kp-card);border:1px solid var(--kp-border);border-radius:28px;box-shadow:0 18px 50px #28174d0b}
.file-hero:before{content:"";position:absolute;right:-95px;top:-135px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,#5271ff1c,transparent 68%);pointer-events:none}
.file-hero>*{position:relative}
.file-hero h1{max-width:760px;margin:12px 0 10px;font-size:clamp(28px,5vw,46px);line-height:1.12;letter-spacing:-1.7px;overflow-wrap:anywhere}
.file-hero .lead{max-width:720px;margin:0 0 22px}
.file-meta{display:flex;flex-wrap:wrap;gap:9px;margin:22px 0 26px}
.file-meta span{display:inline-flex;align-items:center;padding:7px 11px;border:1px solid var(--kp-border);border-radius:999px;background:#f6f8fd;color:#4a5266;font-size:12px;font-weight:650}
.actions{display:flex;gap:12px;flex-wrap:wrap}
.actions button{min-height:48px;padding:0 21px;border:0;border-radius:13px;font:inherit;font-weight:800;cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s}
.actions button:hover{transform:translateY(-1px)}
.actions button:disabled{opacity:.65;cursor:wait;transform:none}
.actions .primary{background:linear-gradient(135deg,#5271ff,#3049c2);color:white;box-shadow:0 8px 18px #5271ff30}
.actions .primary:hover{box-shadow:0 10px 24px #5271ff40}
.actions .secondary{background:#e9eeff;color:#3f5ce6;border:1px solid #d3dcff}
.form-message{min-height:24px;margin:15px 0 0;color:#625d75;font-size:13px;overflow-wrap:anywhere}
.ad-section{margin-top:24px;padding:clamp(20px,4vw,34px);border:1px solid var(--kp-border);border-radius:24px;background:linear-gradient(135deg,#fff,#f6f8fd);box-shadow:0 12px 34px #28174d08}
.ad-section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}
.ad-section-head h2,.ad-section-head p{display:none}
.ad-label{display:inline-flex;padding:5px 9px;border-radius:7px;background:#e9eeff;color:#3f5ce6;font-size:10px;font-weight:850;letter-spacing:1px}
.ad-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:stretch}
.ad-grid .ad-card:last-child:nth-child(odd){grid-column:1/-1;justify-self:center;width:min(100%,calc(50% - 7px))}
.ad-card{min-width:0;padding:19px;border:1px solid var(--kp-border);border-radius:17px;background:#fff}
.ad-card h3{margin:0 0 5px;font-size:16px;letter-spacing:-.2px}
.ad-card p{margin:0;color:var(--kp-muted);font-size:12px;line-height:1.6}
.banner-frame{display:flex;justify-content:center;align-items:center;min-height:270px;margin-top:14px;padding:10px;border:1px dashed #d3dcff;border-radius:13px;background:#f6f8fd;overflow:hidden}
.banner-frame iframe{max-width:100%}
.unlock-section{margin-top:24px;padding:clamp(22px,4vw,34px);border:1px solid var(--kp-border);border-radius:24px;background:#fff;text-align:center;box-shadow:0 12px 34px #28174d08}.unlock-section h2{margin:8px 0;font-size:clamp(22px,3vw,30px)}.unlock-section p{color:var(--kp-muted);margin:8px auto 18px;max-width:560px}.timer-text{font-weight:800;color:var(--kp-purple)!important;font-size:18px}.unlock-section .actions{justify-content:center}.unlock-section .actions button{min-width:220px}.unlock-section [hidden]{display:none!important}.scroll-unlock{margin-top:18px}.ad-label{display:inline-flex;padding:5px 9px;border-radius:7px;background:#e9eeff;color:#3f5ce6;font-size:10px;font-weight:850;letter-spacing:1px}
@media(max-width:720px){.legal-page{width:min(100% - 22px,680px);margin:22px auto 42px}.file-hero{border-radius:20px;padding:24px 19px}.file-hero h1{letter-spacing:-1px}.ad-section{padding:18px 13px;border-radius:19px}.ad-section-head{display:block}.ad-section-head .ad-label{margin-bottom:10px}.ad-grid{grid-template-columns:1fr}.ad-grid .ad-card:last-child:nth-child(odd){grid-column:auto;width:100%}.banner-frame{min-height:260px;padding:6px}.actions{display:grid;grid-template-columns:1fr}.actions button{width:100%}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition:none!important}}
</style>

<body>

<header class="site-header">
  <a class="logo" href="index.html" aria-label="KaroPays home"><img class="logo-img" src="assets/img/karopays-logo.png" alt="KaroPays" width="112" height="52"></a>
  <div class="site-header-actions">
    <a class="header-login" href="login.html">Login</a>
    <a class="nav-cta header-register" href="register.html">Register</a>

<main class="legal-page">

  <div id="state">
    <div class="section-label">KAROPAYS FILE</div>
    <h1>Loading file...</h1>
    <p class="lead">Please wait.</p>
  </div>


  <section id="content" style="display:none">

    <div class="file-hero">

      <div class="eyebrow" id="cat">
        FILE
      </div>

      <h1 id="name"></h1>

      <p class="lead" id="desc"></p>

      <div class="file-meta" id="meta"></div>

      <div class="actions">

    <section class="ad-section" aria-label="Sponsored ads">

    <section id="unlock-section" class="unlock-section" aria-labelledby="unlock-title">
      <div class="eyebrow">FILE ACCESS</div>

      <div class="actions" style="justify-content:center">
        <button class="primary" id="start-unlock" type="button">Unlock File</button>
        <button class="secondary" id="download-fast" type="button">Download Fast ↗</button>
      </div>
      <p id="unlock-timer" class="timer-text" aria-live="polite" hidden></p>
      <div class="actions" id="real-download-row" style="justify-content:center;margin-top:12px" hidden>
        <button class="primary" id="download" type="button">Download File</button>
      </div>
      <p id="unlock-message" class="form-message" aria-live="polite"></p>
    </section>
  </section>

</main>


<!-- ======================================================
     SUPABASE
====================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/slot-loader.js"></script>
<script src="assets/js/site.js" defer></script>


<script>

"use strict";


/* =========================================================
   CONFIGURATION
========================================================= */

/*
 * This MUST be the deployed Edge Function that you tested
 * successfully.
 *
 * Do NOT use:
 *
 * record-download
 *
 * Do NOT use:
 *
 * record_download
 *
 * We use ONLY:
 *
 * smooth-api
 */
const DOWNLOAD_FUNCTION = "smooth-api";


/*
 * File ID from URL:
 *
 * file.html?id=xxxxxxxx
 */
const id =
  new URLSearchParams(
    window.location.search
  ).get("id");


/*
 * Current file
 */
let file = null;


/*
 * Short DOM helper
 */
const $ = (id) =>
  document.getElementById(id);


/* =========================================================
   START
========================================================= */

loadFile();


/* =========================================================
   AD LEVELS
   1 Low: banner
   2 Medium: banner + in-page push
   3 High: Medium + OnClick/popunder
   4 Ultra: High + push notification + vignette
   The SmartLink offer is shown separately at every level.
========================================================= */
const AD_LEVEL_LABELS = { 1: "Low", 2: "Medium", 3: "High", 4: "Ultra" };

function renderAds(rawLevel) {
  const level = Math.min(4, Math.max(1, Number(rawLevel) || 1));
  // 3 independent banner placements at every level (each in its own iframe).
  KaroAds.mountBanners($("kp-ad-slots"), 3);
  // Extra network formats by level (failures are ignored silently).
  if (level >= 2) KaroAds.addTag("https://nap5k.com/tag.min.js", { "data-zone": "11999578" });
  if (level >= 3) KaroAds.addTag("https://al5sm.com/tag.min.js", { "data-zone": "11999574" });
  if (level >= 4) {
    KaroAds.addTag("https://5gvci.com/act/files/tag.min.js?z=11999575", { "data-cfasync": "false" });
    KaroAds.addTag("https://n6wxm.com/vignette.min.js", { "data-zone": "11999580" });
  }
}

function renderMeta() {
  $("meta").innerHTML =
    "<span>" + esc(file.category || "Other") + "</span>" +
    "<span>" + bytes(file.file_size) + "</span>" +
    "<span>" + (Number(file.downloads) || 0).toLocaleString() + " downloads</span>" +
    "<span>Ad Level " + (AD_LEVEL_LABELS[Number(file.ad_level)] || "Low") + "</span>";
}

/* =========================================================
   LOAD FILE
========================================================= */

async function loadFile() {

  if (!id) {
    showError();
    return;
  }


  try {

    // Use the public RPC so visitors on other devices can load
    // active shared files without requiring direct table SELECT access.
    // The RPC returns a TABLE result, which Supabase supplies as an array.
    const {
      data,
      error: e
    } = await supabaseClient.rpc("get_public_file", {
      p_file_id: id
    });

    const f = Array.isArray(data) ? (data[0] || null) : data;


    if (e) {

      console.error(
        "Public file lookup error:",
        e
      );

      showError();
      return;
    }


    if (!f || String(f.status || "").toLowerCase() !== "active") {

      showError();
      return;
    }


    file = f;

    /*
     * File information
     */
    $("name").textContent =
      f.file_name ||
      "Unnamed file";


    $("desc").textContent =
      f.description ||
      "No description provided.";


    $("cat").textContent =
      f.category ||
      "FILE";


    /*
     * File metadata
     */
    renderMeta();


    /*
     * Show content
     */
    $("state").style.display =
      "none";

    $("content").style.display =
      "block";

    // Render ads AFTER the content is visible so the ad iframes get real dimensions.
    renderAds(f.ad_level);


  } catch (error) {

    console.error(
      "Unexpected file loading error:",
      error
    );

    showError();
  }
}


/* =========================================================
   FILE ERROR
========================================================= */

function showError() {

  $("state").innerHTML = `

    <div class="section-label">
      FILE
    </div>

    <h1>
      File unavailable
    </h1>

    <p class="lead">
      This file does not exist or is no longer available.
    </p>

    <a
      class="primary"
      href="index.html"
    >
      Back to KaroPays
    </a>

  `;
}


/* =========================================================
   DOWNLOAD
========================================================= */

/*
 * SECURITY FLOW
 *
 * Browser
 *    ↓
 * smooth-api
 *    ↓
 * Check file
 *    ↓
 * Downloader IP
 *    ↓
 * Country
 *    ↓
 * Ad level
 *    ↓
 * payout_rates
 *    ↓
 * download_attempts
 *    ↓
 * download_earnings
 *    ↓
 * File statistics
 *    ↓
 * Signed URL
 *    ↓
 * Download
 *
 *
 * The browser sends ONLY:
 *
 * file_id
 *
 *
 * Browser cannot choose:
 *
 * - country
 * - payout rate
 * - earning
 * - creator
 */


// The top CTA scrolls to the unlock controls at the bottom of the page.
$("scroll-unlock").addEventListener("click", () => {
  $("unlock-section").scrollIntoView({ behavior: "smooth", block: "center" });
});

// SmartLink is an optional fast route; it is separate from the secure file download.
$("download-fast").addEventListener("click", () => {
  window.open("https://uplcm.com/4/11999748", "_blank", "noopener,noreferrer");
});

let unlockStarted = false;
$("start-unlock").addEventListener("click", () => {
  if (unlockStarted) return;
  unlockStarted = true;
  const startButton = $("start-unlock");
  const timer = $("unlock-timer");
  startButton.disabled = true;
  timer.hidden = false;
  let remaining = 14;
  timer.textContent = `Your download unlocks in ${remaining} seconds…`;
  const tick = () => {
    remaining -= 1;
    if (remaining <= 0) {
      timer.textContent = "Your file is ready to download.";
      $("real-download-row").hidden = false;
      startButton.hidden = true;
      return;
    }
    timer.textContent = `Your download unlocks in ${remaining} seconds…`;
    window.setTimeout(tick, 1000);
  };
  window.setTimeout(tick, 1000);
});

$("download").onclick =
  async function () {

    if (!file) {
      return;
    }


    const button =
      $("download");


    button.disabled =
      true;


    button.textContent =
      "Preparing download...";


    $("message").textContent =
      "";


    try {

      /* =================================================
         STEP 1
         RECORD DOWNLOAD + RECEIVE SERVER-SIGNED URL
      ================================================= */

      console.log(
        "Calling Edge Function:",
        DOWNLOAD_FUNCTION
      );


      const {
        data: result,
        error: recordError
      } =
        await supabaseClient
          .functions
          .invoke(
            DOWNLOAD_FUNCTION,
            {
              body: {
                file_id: file.id
              }
            }
          );


      /* =================================================
         EDGE FUNCTION ERROR
      ================================================= */

      if (recordError) {

        console.error(
          "Edge Function error object:",
          recordError
        );


        /*
         * Try to read the actual response body.
         *
         * Supabase sometimes gives only:
         *
         * "Edge Function returned a non-2xx status code"
         *
         * The response body can contain the real reason.
         */

        let backendError =
          recordError.message ||
          "The download service rejected the request.";


        try {

          if (
            recordError.context &&
            typeof recordError.context.json ===
              "function"
          ) {

            const errorBody =
              await recordError.context.json();


            console.error(
              "Edge Function response:",
              errorBody
            );


            if (
              errorBody &&
              errorBody.error
            ) {

              backendError =
                errorBody.error;


              if (
                errorBody.details
              ) {

                backendError +=
                  " — " +
                  errorBody.details;
              }

            }

          }

        } catch (
          parseError
        ) {

          console.error(
            "Could not parse Edge Function error:",
            parseError
          );

        }


        throw new Error(
          backendError
        );
      }


      /* =================================================
         LOG SUCCESS RESPONSE
      ================================================= */

      console.log(
        "smooth-api response:",
        result
      );


      /* =================================================
         CHECK RESPONSE
      ================================================= */

      if (
        !result ||
        result.success !== true
      ) {

        throw new Error(
          result?.error ||
          "The download could not be recorded."
        );
      }

      if (typeof result.signed_url !== "string" || !result.signed_url) {
        throw new Error("The server did not return a secure download link.");
      }


      /* =================================================
         SUCCESS MESSAGE
      ================================================= */

      $("message").textContent =
        "✓ Download recorded. Your download is starting...";


      /*
       * Update displayed download count locally.
       */
      if (
        typeof result.downloads ===
        "number"
      ) {

        file.downloads =
          result.downloads;


        renderMeta();

      }


      /* =================================================
         START REAL DOWNLOAD
      ================================================= */

      /*
       * IMPORTANT:
       *
       * The file is downloaded ONLY after the
       * Edge Function says success:true.
       */

      window.location.href =
        result.signed_url;


    } catch (error) {

      console.error(
        "KaroPays download error:",
        error
      );


      /*
       * Show the actual backend error.
       */
      $("message").textContent =
        error?.message ||
        "Could not start the download.";


      /*
       * Allow user to try again.
       */
      button.disabled =
        false;


      button.textContent =
        "Download File";
    }

  };


/* =========================================================
   SHARE
========================================================= */

$("share").onclick =
  async function () {

    try {

      if (
        navigator.share
      ) {

        await navigator.share({

          title:
            file?.file_name ||
            "KaroPays file",

          url:
            window.location.href

        });

      } else {

        await navigator.clipboard.writeText(
          window.location.href
        );


        $("message").textContent =
          "✓ File link copied to clipboard.";
      }


    } catch (error) {

      /*
       * User cancelling native share is not an error.
       */
      if (
        error?.name !==
        "AbortError"
      ) {

        console.error(
          "Share error:",
          error
        );


        $("message").textContent =
          "Could not share the file.";
      }

    }

  };


/* =========================================================
   FILE SIZE
========================================================= */

function bytes(n) {

  n =
    Number(n) || 0;


  if (!n) {
    return "0 B";
  }


  const units = [
    "B",
    "KB",
    "MB",
    "GB",
    "TB"
  ];


  const index =
    Math.floor(
      Math.log(n) /
      Math.log(1024)
    );


  const safeIndex =
    Math.min(
      index,
      units.length - 1
    );


  return (
    n /
    1024 ** safeIndex
  ).toFixed(
    safeIndex ? 2 : 0
  ) +
  " " +
  units[safeIndex];

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function esc(value) {

  return String(value)
    .replace(
      /[&<>'"]/g,
      function (c) {

        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          "'": "&#039;",
          '"': "&quot;"
        }[c];

      }
    );

}

</script>
