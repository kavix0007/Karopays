<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Download File — KaroPays</title>

  <link
    rel="stylesheet"
    href="assets/css/pro.css"
  >

</head>

<body>

<header class="site-header">

  <a class="logo" href="index.html">
    <span class="logo-mark">K</span>
    KaroPays
  </a>

</header>


<main class="legal-page">

  <!-- File category -->

  <div
    class="section-label"
    id="category"
  >
    FILE
  </div>


  <!-- File name -->

  <h1 id="fileName">
    Loading file...
  </h1>


  <!-- Description -->

  <p
    class="lead"
    id="description"
  >
    Please wait...
  </p>


  <!-- File information -->

  <div
    class="rule-grid"
    id="fileInfo"
  >

    <div>

      <small>
        Downloads
      </small>

      <h2 id="downloads">
        0
      </h2>

    </div>


    <div>

      <small>
        File size
      </small>

      <h2 id="fileSize">
        —
      </h2>

    </div>


    <div>

      <small>
        Category
      </small>

      <h2 id="fileCategory">
        —
      </h2>

    </div>

  </div>


  <!-- Advertisement -->

  <div
    class="table-card"
    style="text-align:center;margin-top:30px;"
  >

    <div class="section-label">
      ADVERTISEMENT
    </div>


    <p
      id="adLevelText"
      class="lead"
    >
      Advertisement
    </p>


    <div
      id="adContainer"
      style="
        min-height:180px;
        display:flex;
        align-items:center;
        justify-content:center;
        border:1px dashed #ccc;
        margin:20px 0;
      "
    >

      <span>
        Advertisement
      </span>

    </div>

  </div>


  <!-- Download -->

  <div
    class="table-card"
    style="text-align:center;margin-top:25px;"
  >

    <h2>
      Ready to download?
    </h2>


    <p class="lead">
      Your download will start after the advertisement step.
    </p>


    <button
      class="primary"
      id="downloadButton"
      disabled
    >
      Loading...
    </button>


    <p id="downloadMessage"></p>

  </div>

</main>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/supabase-config.js"></script>


<script>

/* =========================================
   ELEMENTS
========================================= */

const fileNameElement =
  document.getElementById("fileName");

const descriptionElement =
  document.getElementById("description");

const categoryElement =
  document.getElementById("category");

const fileCategoryElement =
  document.getElementById("fileCategory");

const downloadsElement =
  document.getElementById("downloads");

const fileSizeElement =
  document.getElementById("fileSize");

const downloadButton =
  document.getElementById("downloadButton");

const downloadMessage =
  document.getElementById("downloadMessage");

const adLevelText =
  document.getElementById("adLevelText");


/* =========================================
   GET FILE ID
========================================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const fileId =
  params.get("id");


/* =========================================
   START
========================================= */

if (!fileId) {

  showError(
    "No file was specified."
  );

} else {

  loadFile();

}


/* =========================================
   LOAD PUBLIC FILE
========================================= */

async function loadFile() {

  try {

    /*
     * IMPORTANT:
     *
     * We use get_public_file()
     * instead of selecting directly
     * from public.files.
     *
     * This allows visitors who are
     * NOT logged in to view active
     * file pages.
     */

    const {
      data,
      error
    } = await supabaseClient.rpc(
      "get_public_file",
      {
        p_file_id: fileId
      }
    );


    console.log(
      "Public file response:",
      data,
      error
    );


    if (error) {

      console.error(
        "Public file RPC error:",
        error
      );

      showError(
        "Unable to load this file."
      );

      return;

    }


    /*
     * RPC returns an array because
     * the function uses RETURNS TABLE.
     */

    const file =
      data && data.length > 0
        ? data[0]
        : null;


    if (!file) {

      showError(
        "This file does not exist or is no longer available."
      );

      return;

    }


    /* =====================================
       DISPLAY FILE INFORMATION
    ===================================== */

    fileNameElement.textContent =
      file.file_name ||
      "Unnamed file";


    descriptionElement.textContent =
      file.description ||
      "No description provided.";


    categoryElement.textContent =
      file.category ||
      "FILE";


    fileCategoryElement.textContent =
      file.category ||
      "—";


    downloadsElement.textContent =
      Number(
        file.downloads || 0
      ).toLocaleString();


    fileSizeElement.textContent =
      formatFileSize(
        file.file_size
      );


    /* =====================================
       AD LEVEL
    ===================================== */

    const adLevel =
      Number(
        file.ad_level || 2
      );


    const adNames = {

      1: "Low",

      2: "Medium",

      3: "High",

      4: "Ultra"

    };


    if (adLevelText) {

      adLevelText.textContent =
        "Advertisement level: " +
        (
          adNames[adLevel] ||
          "Medium"
        );

    }


    /* =====================================
       ENABLE DOWNLOAD
    ===================================== */

    downloadButton.disabled =
      false;


    downloadButton.textContent =
      "Download File";


    downloadButton.onclick =
      function () {

        downloadFile(file);

      };


  } catch (error) {

    console.error(
      "Load file error:",
      error
    );

    showError(
      "Unable to load this file."
    );

  }

}


/* =========================================
   DOWNLOAD FILE
========================================= */

async function downloadFile(file) {

  downloadButton.disabled =
    true;


  downloadButton.textContent =
    "Preparing download...";


  downloadMessage.textContent =
    "";


  try {

    /* =====================================
       CREATE SIGNED URL
    ===================================== */

    const {
      data,
      error
    } = await supabaseClient.storage

      .from("files")

      .createSignedUrl(
        file.storage_path,
        600
      );


    if (
      error ||
      !data ||
      !data.signedUrl
    ) {

      console.error(
        "Signed URL error:",
        error
      );

      throw new Error(
        "Could not create download link."
      );

    }


    /* =====================================
       DOWNLOAD FILE
    ===================================== */

    downloadButton.textContent =
      "Downloading...";


    const response =
      await fetch(
        data.signedUrl
      );


    if (!response.ok) {

      throw new Error(
        "Download failed."
      );

    }


    /*
     * blob() waits until the complete
     * file has been received.
     */

    const blob =
      await response.blob();


    if (
      !blob ||
      blob.size <= 0
    ) {

      throw new Error(
        "The downloaded file is empty."
      );

    }


    /* =====================================
       CREATE LOCAL DOWNLOAD
    ===================================== */

    const blobUrl =
      URL.createObjectURL(
        blob
      );


    const link =
      document.createElement(
        "a"
      );


    link.href =
      blobUrl;


    link.download =
      file.file_name ||
      "download";


    link.style.display =
      "none";


    document.body.appendChild(
      link
    );


    link.click();


    link.remove();


    /*
     * Give browser time to start
     * the download.
     */

    setTimeout(
      function () {

        URL.revokeObjectURL(
          blobUrl
        );

      },
      2000
    );


    /* =====================================
       RECORD COMPLETED DOWNLOAD
    ===================================== */

    downloadButton.textContent =
      "Recording download...";


    const {
      data: countResult,
      error: countError
    } = await supabaseClient.rpc(
      "record_download",
      {
        p_file_id: file.id,

        /*
         * Currently using India
         * while country detection
         * is being built.
         */

        p_country_code: "IN"
      }
    );


    if (countError) {

      console.error(
        "Download recording error:",
        countError
      );

      throw new Error(
        "Download completed, but the download could not be recorded."
      );

    }


    console.log(
      "Download recorded successfully:",
      countResult
    );


    /* =====================================
       UPDATE DISPLAYED COUNT
    ===================================== */

    const currentDownloads =
      Number(
        file.downloads || 0
      );


    downloadsElement.textContent =
      (
        currentDownloads + 1
      ).toLocaleString();


    /* =====================================
       SUCCESS
    ===================================== */

    downloadButton.textContent =
      "Download Complete";


    downloadMessage.textContent =
      "Your file has been downloaded successfully.";


  } catch (error) {

    console.error(
      "Download error:",
      error
    );


    downloadMessage.textContent =
      error.message ||
      "Unable to download this file.";


    downloadButton.disabled =
      false;


    downloadButton.textContent =
      "Try Again";

  }

}


/* =========================================
   FORMAT FILE SIZE
========================================= */

function formatFileSize(bytes) {

  if (
    bytes === null ||
    bytes === undefined ||
    bytes === "" ||
    Number(bytes) <= 0
  ) {

    return "—";

  }


  const units = [

    "B",

    "KB",

    "MB",

    "GB",

    "TB"

  ];


  let size =
    Number(bytes);


  let unit =
    0;


  while (
    size >= 1024 &&
    unit < units.length - 1
  ) {

    size =
      size / 1024;

    unit++;

  }


  return (

    size.toFixed(

      size >= 10 || unit === 0

        ? 0

        : 1

    )

    + " "

    + units[unit]

  );

}


/* =========================================
   ERROR SCREEN
========================================= */

function showError(message) {

  fileNameElement.textContent =
    "File unavailable";


  descriptionElement.textContent =
    message;


  categoryElement.textContent =
    "FILE";


  fileCategoryElement.textContent =
    "—";


  fileSizeElement.textContent =
    "—";


  downloadsElement.textContent =
    "0";


  fileSizeElement.textContent =
    "—";


  downloadButton.style.display =
    "none";

}

</script>

</body>

</html>
