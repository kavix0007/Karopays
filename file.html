<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unlock File — KaroPays</title>
<link rel="stylesheet" href="assets/css/pro.css">

<style>
:root{color-scheme:light;--kp-ink:#17152b;--kp-muted:#706d82;--kp-purple:#6d4aff;--kp-purple-dark:#5435d6;--kp-border:#e9e6f3;--kp-bg:#f7f6fc;--kp-card:#fff}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--kp-bg);color:var(--kp-ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55}
.site-header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:15px clamp(18px,5vw,64px);background:rgba(255,255,255,.94);border-bottom:1px solid var(--kp-border);backdrop-filter:blur(12px)}
.logo{display:inline-flex;align-items:center;gap:10px;color:var(--kp-ink);text-decoration:none;font-weight:850;font-size:20px;letter-spacing:-.5px}
.logo-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#8d71ff,#6039ec);color:white;box-shadow:0 6px 16px #6d4aff30}
.desktop-nav{display:flex;align-items:center;gap:clamp(12px,2.5vw,28px);flex-wrap:wrap}
.desktop-nav a{color:#5c5870;text-decoration:none;font-size:13px;font-weight:650}
.desktop-nav a:hover{color:var(--kp-purple)}
.legal-page{width:min(1080px,calc(100% - 32px));margin:42px auto 72px}
#state{max-width:720px;margin:64px auto;padding:40px 26px;text-align:center;background:white;border:1px solid var(--kp-border);border-radius:24px;box-shadow:0 14px 40px #2a1b5010}
.section-label,.eyebrow{display:inline-flex;align-items:center;gap:7px;color:var(--kp-purple);font-size:11px;font-weight:850;letter-spacing:1.5px;text-transform:uppercase}
#state h1{margin:12px 0 8px;font-size:clamp(24px,4vw,34px);letter-spacing:-1px}
.lead{color:var(--kp-muted);line-height:1.7}
#content{display:block}
.file-hero{position:relative;overflow:hidden;padding:clamp(25px,5vw,52px);background:var(--kp-card);border:1px solid var(--kp-border);border-radius:28px;box-shadow:0 18px 50px #28174d0b}
.file-hero:before{content:"";position:absolute;right:-95px;top:-135px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,#8d71ff19,transparent 68%);pointer-events:none}
.file-hero>*{position:relative}
.file-hero h1{max-width:760px;margin:12px 0 10px;font-size:clamp(28px,5vw,46px);line-height:1.12;letter-spacing:-1.7px;overflow-wrap:anywhere}
.file-hero .lead{max-width:720px;margin:0 0 22px}
.file-meta{display:flex;flex-wrap:wrap;gap:9px;margin:22px 0 26px}
.file-meta span{display:inline-flex;align-items:center;padding:7px 11px;border:1px solid var(--kp-border);border-radius:999px;background:#fbfaff;color:#5d5874;font-size:12px;font-weight:650}
.actions{display:flex;gap:12px;flex-wrap:wrap}
.actions button{min-height:48px;padding:0 21px;border:0;border-radius:13px;font:inherit;font-weight:800;cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s}
.actions button:hover{transform:translateY(-1px)}
.actions button:disabled{opacity:.65;cursor:wait;transform:none}
.actions .primary{background:linear-gradient(135deg,#7957ff,#5e3be7);color:white;box-shadow:0 8px 18px #6d4aff30}
.actions .primary:hover{box-shadow:0 10px 24px #6d4aff40}
.actions .secondary{background:#f2efff;color:#5d40dc;border:1px solid #e3dcff}
.form-message{min-height:24px;margin:15px 0 0;color:#625d75;font-size:13px;overflow-wrap:anywhere}
.ad-section{margin-top:24px;padding:clamp(20px,4vw,34px);border:1px solid var(--kp-border);border-radius:24px;background:linear-gradient(135deg,#fff,#fbfaff);box-shadow:0 12px 34px #28174d08}
.ad-section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}
.ad-section-head h2,.ad-section-head p{display:none}
.ad-label{display:inline-flex;padding:5px 9px;border-radius:7px;background:#f0edff;color:#6b4ae7;font-size:10px;font-weight:850;letter-spacing:1px}
.ad-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:stretch}
.ad-card{min-width:0;padding:19px;border:1px solid var(--kp-border);border-radius:17px;background:#fff}
.ad-card h3{margin:0 0 5px;font-size:16px;letter-spacing:-.2px}
.ad-card p{margin:0;color:var(--kp-muted);font-size:12px;line-height:1.6}
.banner-frame{display:flex;justify-content:center;align-items:center;min-height:270px;margin-top:14px;padding:10px;border:1px dashed #d9d2f5;border-radius:13px;background:#faf9ff;overflow:hidden}
.banner-frame iframe{max-width:100%}
.unlock-section{margin-top:24px;padding:clamp(22px,4vw,34px);border:1px solid var(--kp-border);border-radius:24px;background:#fff;text-align:center;box-shadow:0 12px 34px #28174d08}.unlock-section h2{margin:8px 0;font-size:clamp(22px,3vw,30px)}.unlock-section p{color:var(--kp-muted);margin:8px auto 18px;max-width:560px}.timer-text{font-weight:800;color:var(--kp-purple)!important;font-size:18px}.unlock-section .actions{justify-content:center}.unlock-section .actions button{min-width:220px}.unlock-section [hidden]{display:none!important}.scroll-unlock{margin-top:18px}.ad-label{display:inline-flex;padding:5px 9px;border-radius:7px;background:#f0edff;color:#6b4ae7;font-size:10px;font-weight:850;letter-spacing:1px}
@media(max-width:720px){.site-header{padding:12px 16px;align-items:flex-start}.logo{font-size:18px}.desktop-nav{justify-content:flex-end;gap:8px 13px;max-width:58%}.desktop-nav a{font-size:11px}.legal-page{width:min(100% - 22px,680px);margin:22px auto 42px}.file-hero{border-radius:20px;padding:24px 19px}.file-hero h1{letter-spacing:-1px}.ad-section{padding:18px 13px;border-radius:19px}.ad-section-head{display:block}.ad-section-head .ad-label{margin-bottom:10px}.ad-grid{grid-template-columns:1fr}.banner-frame{min-height:260px;padding:6px}.actions{display:grid;grid-template-columns:1fr}.actions button{width:100%}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition:none!important}}
</style>

</head>

<body>

<header class="site-header">
  <a class="logo" href="index.html">
    <span class="logo-mark">K</span>KaroPays
  </a>

  <nav class="desktop-nav">
    <a href="payout-rates.html">Payout Rates</a>
    <a href="payment-proof.html">Payment Proof</a>
    <a href="premium.html">Premium</a>
    <a href="login.html">Sign in</a>
  </nav>
</header>


<main class="legal-page">

  <div id="state">
    <div class="section-label">KAROPAYS FILE</div>
    <h1>Loading file...</h1>
    <p class="lead">Please wait.</p>
  </div>


  <section id="content" style="display:none">

    <div class="file-hero">

      <div class="eyebrow" id="cat">
        FILE
      </div>

      <h1 id="name"></h1>

      <p class="lead" id="desc"></p>

      <div class="file-meta" id="meta"></div>

      <div class="actions">
        <button class="primary" id="scroll-unlock" type="button">Scroll down to unlock file ↓</button>
        <button class="secondary" id="share" type="button">Share file</button>
      </div>

      <p
        id="message"
        class="form-message"
      ></p>

    </div>

    <!-- Ad formats are controlled by the file's saved ad_level. -->
    <section class="ad-section" aria-label="Sponsored ads">
      <div class="ad-section-head"><span class="ad-label">Sponsored</span></div>
      <div id="kp-ad-slots" class="ad-grid"></div>
    </section>

    <section id="unlock-section" class="unlock-section" aria-labelledby="unlock-title">
      <div class="eyebrow">FILE ACCESS</div>
      <h2 id="unlock-title">Unlock your file</h2>
      <p>Start the short timer to prepare your download. When the timer finishes, the download button will appear.</p>
      <div class="actions" style="justify-content:center">
        <button class="primary" id="start-unlock" type="button">Unlock File</button>
        <button class="secondary" id="download-fast" type="button">Download Fast ↗</button>
      </div>
      <p id="unlock-timer" class="timer-text" aria-live="polite" hidden></p>
      <div class="actions" id="real-download-row" style="justify-content:center;margin-top:12px" hidden>
        <button class="primary" id="download" type="button">Download File</button>
      </div>
      <p id="unlock-message" class="form-message" aria-live="polite"></p>
    </section>
  </section>

</main>


<!-- ======================================================
     SUPABASE
====================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/supabase-config.js"></script>


<script>

"use strict";


/* =========================================================
   CONFIGURATION
========================================================= */

/*
 * This MUST be the deployed Edge Function that you tested
 * successfully.
 *
 * Do NOT use:
 *
 * record-download
 *
 * Do NOT use:
 *
 * record_download
 *
 * We use ONLY:
 *
 * smooth-api
 */
const DOWNLOAD_FUNCTION = "smooth-api";


/*
 * File ID from URL:
 *
 * file.html?id=xxxxxxxx
 */
const id =
  new URLSearchParams(
    window.location.search
  ).get("id");


/*
 * Current file
 */
let file = null;


/*
 * Short DOM helper
 */
const $ = (id) =>
  document.getElementById(id);


/* =========================================================
   START
========================================================= */

loadFile();


/* =========================================================
   AD LEVELS
   1 Low: banner
   2 Medium: banner + in-page push
   3 High: Medium + OnClick/popunder
   4 Ultra: High + push notification + vignette
   The SmartLink offer is shown separately at every level.
========================================================= */
function appendAdScript(src, attrs = {}) {
  const script = document.createElement("script");
  script.src = src;
  script.async = true;
  Object.entries(attrs).forEach(([key, value]) => script.setAttribute(key, value));
  document.body.appendChild(script);
}

async function loadBannerInto(slot) {
  slot.style.cssText = "width:100%;min-height:270px;max-width:100%;display:flex;justify-content:center;align-items:center;text-align:center;overflow:hidden;";
  const options = { key: "82565278dee02e769d1a15ccdd7a7b49", format: "iframe", height: 250, width: 300, params: {} };
  // Each banner gets its own invocation and options object. Actual fill is controlled by the ad provider.
  const config = document.createElement("script");
  config.text = "window.atOptions = " + JSON.stringify(options) + ";";
  slot.appendChild(config);
  const invoke = document.createElement("script");
  invoke.src = "https://www.highrevenueformat.com/82565278dee02e769d1a15ccdd7a7b49/invoke.js";
  invoke.async = false;
  slot.appendChild(invoke);
}

function renderAds(rawLevel) {
  const level = Math.min(4, Math.max(1, Number(rawLevel) || 1));
  const slots = $("kp-ad-slots");
  slots.replaceChildren();
  // Three banner placements are shown at every saved ad level.
  for (let i = 0; i < 3; i++) {
    const card = document.createElement("article");
    card.className = "ad-card";
    const frame = document.createElement("div");
    frame.className = "banner-frame";
    frame.id = `kp-banner-slot-${i + 1}`;
    card.appendChild(frame);
    slots.appendChild(card);
    loadBannerInto(frame);
  }
  // Additional network formats are enabled by level; do not render extra format headings/cards.
  if (level >= 2) {
    (function(s){s.dataset.zone='11999578';s.src='https://nap5k.com/tag.min.js'})(document.body.appendChild(document.createElement('script')));
  }
  if (level >= 3) {
    (function(s){s.dataset.zone='11999574';s.src='https://al5sm.com/tag.min.js'})(document.body.appendChild(document.createElement('script')));
  }
  if (level >= 4) {
    appendAdScript("https://5gvci.com/act/files/tag.min.js?z=11999575", {"data-cfasync":"false"});
    (function(s){s.dataset.zone='11999580';s.src='https://n6wxm.com/vignette.min.js'})(document.body.appendChild(document.createElement('script')));
  }
}

/* =========================================================
   LOAD FILE
========================================================= */

async function loadFile() {

  if (!id) {
    showError();
    return;
  }


  try {

    const {
      data: f,
      error: e
    } =
      await supabaseClient
        .from("files")
        .select(
          `
          id,
          file_name,
          file_size,
          description,
          category,
          ad_level,
          downloads,
          status,
          storage_path
          `
        )
        .eq(
          "id",
          id
        )
        .eq(
          "status",
          "active"
        )
        .single();


    if (e) {

      console.error(
        "File lookup error:",
        e
      );

      showError();
      return;
    }


    if (!f) {

      showError();
      return;
    }


    file = f;

    // Apply the saved ad level for this file; the browser does not set payout rates.
    renderAds(f.ad_level);

    /*
     * File information
     */
    $("name").textContent =
      f.file_name ||
      "Unnamed file";


    $("desc").textContent =
      f.description ||
      "No description provided.";


    $("cat").textContent =
      f.category ||
      "FILE";


    /*
     * File metadata
     */
    $("meta").innerHTML = `
      <span>
        ${esc(f.category || "Other")}
      </span>

      <span>
        ${bytes(f.file_size)}
      </span>

      <span>
        ${(Number(f.downloads) || 0).toLocaleString()}
        downloads
      </span>

      <span>
        Ad Level ${({1:"Low",2:"Medium",3:"High",4:"Ultra"}[Number(f.ad_level)] || "Low")}
      </span>
    `;


    /*
     * Show content
     */
    $("state").style.display =
      "none";

    $("content").style.display =
      "block";


  } catch (error) {

    console.error(
      "Unexpected file loading error:",
      error
    );

    showError();
  }
}


/* =========================================================
   FILE ERROR
========================================================= */

function showError() {

  $("state").innerHTML = `

    <div class="section-label">
      FILE
    </div>

    <h1>
      File unavailable
    </h1>

    <p class="lead">
      This file does not exist or is no longer available.
    </p>

    <a
      class="primary"
      href="index.html"
    >
      Back to KaroPays
    </a>

  `;
}


/* =========================================================
   DOWNLOAD
========================================================= */

/*
 * SECURITY FLOW
 *
 * Browser
 *    ↓
 * smooth-api
 *    ↓
 * Check file
 *    ↓
 * Downloader IP
 *    ↓
 * Country
 *    ↓
 * Ad level
 *    ↓
 * payout_rates
 *    ↓
 * download_attempts
 *    ↓
 * download_earnings
 *    ↓
 * File statistics
 *    ↓
 * Signed URL
 *    ↓
 * Download
 *
 *
 * The browser sends ONLY:
 *
 * file_id
 *
 *
 * Browser cannot choose:
 *
 * - country
 * - payout rate
 * - earning
 * - creator
 */


// The top CTA scrolls to the unlock controls at the bottom of the page.
$("scroll-unlock").addEventListener("click", () => {
  $("unlock-section").scrollIntoView({ behavior: "smooth", block: "center" });
});

// SmartLink is an optional fast route; it is separate from the secure file download.
$("download-fast").addEventListener("click", () => {
  window.open("https://uplcm.com/4/11999748", "_blank", "noopener,noreferrer");
});

let unlockStarted = false;
$("start-unlock").addEventListener("click", () => {
  if (unlockStarted) return;
  unlockStarted = true;
  const startButton = $("start-unlock");
  const timer = $("unlock-timer");
  startButton.disabled = true;
  timer.hidden = false;
  let remaining = 14;
  timer.textContent = `Your download unlocks in ${remaining} seconds…`;
  const tick = () => {
    remaining -= 1;
    if (remaining <= 0) {
      timer.textContent = "Your file is ready to download.";
      $("real-download-row").hidden = false;
      startButton.hidden = true;
      return;
    }
    timer.textContent = `Your download unlocks in ${remaining} seconds…`;
    window.setTimeout(tick, 1000);
  };
  window.setTimeout(tick, 1000);
});

$("download").onclick =
  async function () {

    if (!file) {
      return;
    }


    const button =
      $("download");


    button.disabled =
      true;


    button.textContent =
      "Preparing download...";


    $("message").textContent =
      "";


    try {

      /* =================================================
         STEP 1
         CREATE SIGNED URL
      ================================================= */

      /*
       * We create the signed URL before recording the
       * earning.
       *
       * This prevents recording an earning if the file
       * cannot actually be accessed.
       */

      const {
        data: signed,
        error: signedError
      } =
        await supabaseClient
          .storage
          .from("files")
          .createSignedUrl(
            file.storage_path,
            120
          );


      if (
        signedError ||
        !signed ||
        !signed.signedUrl
      ) {

        console.error(
          "Signed URL error:",
          signedError
        );


        throw new Error(
          signedError?.message ||
          "Could not create a download link."
        );
      }


      console.log(
        "Signed URL created successfully."
      );


      /* =================================================
         STEP 2
         RECORD DOWNLOAD
      ================================================= */

      console.log(
        "Calling Edge Function:",
        DOWNLOAD_FUNCTION
      );


      const {
        data: result,
        error: recordError
      } =
        await supabaseClient
          .functions
          .invoke(
            DOWNLOAD_FUNCTION,
            {
              body: {
                file_id: file.id
              }
            }
          );


      /* =================================================
         EDGE FUNCTION ERROR
      ================================================= */

      if (recordError) {

        console.error(
          "Edge Function error object:",
          recordError
        );


        /*
         * Try to read the actual response body.
         *
         * Supabase sometimes gives only:
         *
         * "Edge Function returned a non-2xx status code"
         *
         * The response body can contain the real reason.
         */

        let backendError =
          recordError.message ||
          "The download service rejected the request.";


        try {

          if (
            recordError.context &&
            typeof recordError.context.json ===
              "function"
          ) {

            const errorBody =
              await recordError.context.json();


            console.error(
              "Edge Function response:",
              errorBody
            );


            if (
              errorBody &&
              errorBody.error
            ) {

              backendError =
                errorBody.error;


              if (
                errorBody.details
              ) {

                backendError +=
                  " — " +
                  errorBody.details;
              }

            }

          }

        } catch (
          parseError
        ) {

          console.error(
            "Could not parse Edge Function error:",
            parseError
          );

        }


        throw new Error(
          backendError
        );
      }


      /* =================================================
         LOG SUCCESS RESPONSE
      ================================================= */

      console.log(
        "smooth-api response:",
        result
      );


      /* =================================================
         CHECK RESPONSE
      ================================================= */

      if (
        !result ||
        result.success !== true
      ) {

        throw new Error(
          result?.error ||
          "The download could not be recorded."
        );
      }


      /* =================================================
         SUCCESS MESSAGE
      ================================================= */

      $("message").textContent =
        "✓ Download recorded. Your download is starting...";


      /*
       * Update displayed download count locally.
       */
      if (
        typeof result.downloads ===
        "number"
      ) {

        file.downloads =
          result.downloads;


        $("meta").innerHTML = `
          <span>
            ${esc(file.category || "Other")}
          </span>

          <span>
            ${bytes(file.file_size)}
          </span>

          <span>
            ${Number(file.downloads).toLocaleString()}
            downloads
          </span>

          <span>
            Ad Level ${Number(file.ad_level) || 1}
          </span>
        `;

      }


      /* =================================================
         START REAL DOWNLOAD
      ================================================= */

      /*
       * IMPORTANT:
       *
       * The file is downloaded ONLY after the
       * Edge Function says success:true.
       */

      window.location.href =
        signed.signedUrl;


    } catch (error) {

      console.error(
        "KaroPays download error:",
        error
      );


      /*
       * Show the actual backend error.
       */
      $("message").textContent =
        error?.message ||
        "Could not start the download.";


      /*
       * Allow user to try again.
       */
      button.disabled =
        false;


      button.textContent =
        "Download file";
    }

  };


/* =========================================================
   SHARE
========================================================= */

$("share").onclick =
  async function () {

    try {

      if (
        navigator.share
      ) {

        await navigator.share({

          title:
            file?.file_name ||
            "KaroPays file",

          url:
            window.location.href

        });

      } else {

        await navigator.clipboard.writeText(
          window.location.href
        );


        $("message").textContent =
          "✓ File link copied to clipboard.";
      }


    } catch (error) {

      /*
       * User cancelling native share is not an error.
       */
      if (
        error?.name !==
        "AbortError"
      ) {

        console.error(
          "Share error:",
          error
        );


        $("message").textContent =
          "Could not share the file.";
      }

    }

  };


/* =========================================================
   FILE SIZE
========================================================= */

function bytes(n) {

  n =
    Number(n) || 0;


  if (!n) {
    return "0 B";
  }


  const units = [
    "B",
    "KB",
    "MB",
    "GB",
    "TB"
  ];


  const index =
    Math.floor(
      Math.log(n) /
      Math.log(1024)
    );


  const safeIndex =
    Math.min(
      index,
      units.length - 1
    );


  return (
    n /
    1024 ** safeIndex
  ).toFixed(
    safeIndex ? 2 : 0
  ) +
  " " +
  units[safeIndex];

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function esc(value) {

  return String(value)
    .replace(
      /[&<>'"]/g,
      function (c) {

        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          "'": "&#039;",
          '"': "&quot;"
        }[c];

      }
    );

}

</script>

</body>
