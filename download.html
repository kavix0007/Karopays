<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preparing Download — KaroPays</title><meta name="theme-color" content="#5271ff"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fc;color:#17213b;font-family:Inter,system-ui,sans-serif}main{text-align:center;background:white;border:1px solid #e6eaf2;border-radius:18px;padding:32px;max-width:420px;margin:20px}p{color:#68738a;line-height:1.6}.spin{width:28px;height:28px;border:3px solid #e4eaff;border-top-color:#5271ff;border-radius:50%;margin:18px auto;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head>
<body><main><h2>KaroPays</h2><div class="spin"></div><p id="status">Preparing your download…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script>
(async()=>{const id=new URLSearchParams(location.search).get('id')||'';const uuid=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;if(!uuid.test(id)){location.replace('index.html');return;}const file='file.html?id='+encodeURIComponent(id);try{const {data,error}=await supabaseClient.from('download_page_settings').select('enabled,page1_enabled,page2_enabled').eq('id',true).maybeSingle();if(error||!data||!data.enabled){location.replace(file);return;}if(data.page1_enabled){location.replace('download-ad-1.html?id='+encodeURIComponent(id));return;}if(data.page2_enabled){location.replace('download-ad-2.html?id='+encodeURIComponent(id));return;}location.replace(file);}catch(e){console.error(e);location.replace(file);}})();
</script></body></html>
